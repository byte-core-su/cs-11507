        body {

        /* 簡單的淡入動畫 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }

        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }
        .animate-fade-in {

  <script type="module">
      import { initializeApp, getApp, getApps } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
      import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
      import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

      const { SCHOOL_APP, LearnerProfile } = window;
      const storageKey = SCHOOL_APP.storageKeys.flowchartProgress;
      let scopedStorageKey = '';
      let records = {};
      let firebaseUser = null;
      let db = null;
      let ready;
      window.FlowchartProgress = new Promise(resolve => { ready = resolve; });
      const storageKeyFor = user => `${storageKey}.${user?.uid || 'guest'}`;
      const loadLocal = () => LearnerProfile.readTermStorage(scopedStorageKey, {}).units || {};
      const storeLocal = () => LearnerProfile.writeTermStorage(scopedStorageKey, { units: records });
      if (!SCHOOL_APP.isFirebaseConfigured()) {
          scopedStorageKey = storageKeyFor();
          records = loadLocal();
          ready(records);
      }
      else {
          const app = getApps().length ? getApp() : initializeApp(SCHOOL_APP.firebaseConfig);
          db = getFirestore(app);
          onAuthStateChanged(getAuth(app), async user => {
              firebaseUser = user;
              scopedStorageKey = storageKeyFor(user);
              records = loadLocal();
              if (!user) { ready(records); return; }
              try {
                  const snapshot = await getDoc(doc(db, 'users', user.uid));
                  const remote = snapshot.data()?.terms?.[SCHOOL_APP.currentTermId]?.workflow?.flowcharts || {};
                  records = { ...records, ...remote };
                  storeLocal();
              } catch (error) { console.error(error); }
              ready(records);
          });
      }
      window.saveFlowchartProgress = async (unitId, record) => {
          records = { ...records, [unitId]: record };
          storeLocal();
          if (firebaseUser && db) await setDoc(doc(db, 'users', firebaseUser.uid), {
              terms: { [SCHOOL_APP.currentTermId]: { workflow: { flowcharts: records }, updatedAt: new Date().toISOString() } }
          }, { merge: true });
          return records;
      };
  </script>

                                        </div>

                                        {/* 右側：行動呼籲連結 */}
                                        <div className="lg:col-span-1 space-y-6">
                                            <section className="rounded-xl border border-emerald-200 bg-emerald-50 p-6 shadow-sm">
                                                <div className="flex items-center gap-3"><div className="rounded-lg bg-emerald-100 p-2 text-xl">🗺️</div><div><p className="text-xs font-black tracking-[.16em] text-emerald-700">STEP 1 · FLOWCHART</p><h3 className="font-black text-slate-800">先完成流程圖任務</h3></div></div>
                                                <p className="mt-4 text-sm leading-6 text-slate-600">依照「解題提示挑戰」中的程式設計概念，先排出實作前的流程圖步驟；這不是學習重點的重新排列。</p>
                                                <div className="mt-3 space-y-2">
                                                    {orderedFlowSteps.map((step, index) => <div key={`${step}-${index}`} className="flex items-center gap-2 rounded-lg border border-emerald-200 bg-white p-2 text-sm text-slate-700"><span className="grid h-6 w-6 shrink-0 place-items-center rounded-full bg-emerald-100 text-xs font-black text-emerald-700">{index + 1}</span><span className="min-w-0 flex-1 leading-5">{step}</span><div className="flex gap-1"><button type="button" onClick={() => moveFlowStep(index, -1)} disabled={index === 0} className="rounded bg-slate-100 px-2 py-1 font-bold disabled:opacity-30" aria-label="上移">↑</button><button type="button" onClick={() => moveFlowStep(index, 1)} disabled={index === orderedFlowSteps.length - 1} className="rounded bg-slate-100 px-2 py-1 font-bold disabled:opacity-30" aria-label="下移">↓</button></div></div>)}
                                                </div>
                                                <button type="button" onClick={completeFlowchartTask} className="mt-3 w-full rounded-lg bg-emerald-600 px-3 py-3 text-sm font-bold text-white shadow-sm hover:bg-emerald-700">檢查排列順序並完成此步驟</button>
                                                <p className={`mt-3 text-xs font-bold ${flowchartRecords[selectedUnit.id]?.completedAt ? 'text-emerald-700' : 'text-slate-500'}`}>{flowchartMessage || (flowchartRecords[selectedUnit.id]?.completedAt ? '✓ 已完成本單元流程圖任務。' : '尚未完成流程圖任務')}</p>
                                            </section>
                                            
                                            {/* 1. 原始程式連結 */}
                                            <div className="bg-white rounded-xl p-6 border border-blue-100 shadow-sm hover:shadow-md transition-shadow">
                                                <div className="flex items-center mb-3">
                                                    <div className="p-2 bg-blue-100 rounded-lg mr-3">
                                                        <Icons.Code className="w-5 h-5 text-blue-600" />
                                                    </div>
                                                    <h3 className="font-bold text-slate-800">範例程式碼</h3>
                                                </div>
                                                <p className="text-sm text-slate-500 mb-2">點擊下方按鈕前往 Scratch 官網查看本單元的原始程式碼專案。</p>
                                                {!flowchartRecords[selectedUnit.id]?.completedAt && <p className="mb-4 rounded-lg bg-amber-50 px-3 py-2 text-sm font-bold text-amber-800">請先完成流程圖任務，範例程式碼才會開放。</p>}
                                                <a 
                                                    href={selectedUnit.projectLink} 
                                                    target="_blank" 
                                                    rel="noopener noreferrer"
                                                    className={`learning-action-primary w-full text-center py-3 px-4 ${flowchartRecords[selectedUnit.id]?.completedAt ? 'active:transform active:scale-95' : 'pointer-events-none opacity-40'}`}
                                                >
                                                    {flowchartRecords[selectedUnit.id]?.completedAt ? '開啟原始程式專案' : '完成流程圖後開放'}
                                                </a>
                                            </div>

                                            {/* 2. 解題提示 - 需先通關測驗 */}
                                            <div className="bg-white rounded-xl p-6 border border-green-100 shadow-sm hover:shadow-md transition-shadow">
                                                <div className="flex items-center mb-3">
                                                    <div className="p-2 bg-green-100 rounded-lg mr-3">
                                                         <Icons.Brain className="w-5 h-5 text-green-600" />
                                                    </div>
                                                    <h3 className="font-bold text-slate-800">解題提示挑戰</h3>
                                                </div>
                                                <p className="text-sm text-slate-500 mb-4">
                                                    想查看提示圖嗎？請先連續答對 {selectedUnit.uploadLinks.length + 1} 題關於本單元的觀念測驗！
                                                </p>
                                                
                                                {/* 挑戰按鈕/縮圖區 */}
                                                <div 
                                                    className="w-full h-48 bg-slate-100 rounded-lg overflow-hidden cursor-pointer relative group border border-slate-200"
                                                    onClick={startQuiz}
                                                >
                                                    {/* 模糊處理的圖片，代表鎖定，永遠顯示第一張 */}
                                                    <img 
                                                        src={`${selectedUnit.uploadLinks[0]}?raw=true`} 
                                                        alt="解題提示(鎖定)" 
                                                        className="w-full h-full object-cover blur-sm opacity-60 no-copy"
                                                        draggable="false"
                                                        onContextMenu={(e) => e.preventDefault()}
                                                    />
                                                    
                                                    {/* 鎖定/挑戰 遮罩 */}
                                                    <div className="absolute inset-0 bg-black/10 group-hover:bg-black/30 transition-colors flex flex-col items-center justify-center text-center p-4">
                                                        <div className="bg-green-600 text-white p-3 rounded-full shadow-lg mb-2 transform group-hover:scale-110 transition-transform duration-300">
                                                            <Icons.Brain className="w-6 h-6" />
                                                        </div>
                                                        <span className="bg-white/90 text-green-800 text-sm font-bold px-3 py-1 rounded shadow-sm">
                                                            點擊開始測驗 ({selectedUnit.uploadLinks.length + 1}題)
                                                        </span>
                                                    </div>
                                                    
                                                    {/* 多張圖片標示 */}
                                                    {selectedUnit.uploadLinks.length > 1 && (
                                                        <div className="absolute top-2 right-2 bg-black/60 text-white text-xs px-2 py-1 rounded-md flex items-center backdrop-blur-sm">
                                                            <Icons.Images className="w-3 h-3 mr-1" />
                                                            <span>共 {selectedUnit.uploadLinks.length} 張</span>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>

                                            {/* 提示卡片 */}
                                            <div className="bg-orange-50 rounded-xl p-4 border border-orange-100 relative overflow-hidden">
                                                <div className="absolute top-0 right-0 -mt-2 -mr-2 w-12 h-12 bg-orange-200 rounded-full opacity-50"></div>
                                                <h4 className="text-orange-800 font-bold text-sm mb-2 flex items-center relative z-10">
                                                    <span className="text-lg mr-1">💡</span> 小撇步
                                                </h4>
                                                <p className="text-orange-800/80 text-sm relative z-10">
                                                    遇到困難嗎？您可以先查看「原始程式碼」裡面的積木排列方式，再嘗試自己拼湊看看！
                                                </p>
                                            </div>

                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 測驗 Modal */}
                        {isQuizModalOpen && currentQuizQuestions.length > 0 && (
                            <div className="fixed inset-0 z-[110] bg-black/80 flex items-center justify-center p-4 animate-fade-in backdrop-blur-sm">
                                <div className={`bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 relative ${shake ? 'animate-shake' : ''}`}>
                                    {/* 關閉按鈕 */}
                                    <button 
                                        onClick={() => setIsQuizModalOpen(false)}
                                        className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-colors"
                                    >
                                        <Icons.X className="w-6 h-6" />
                                    </button>

                                    {quizFeedback === 'wrong' ? (
                                        // 答錯畫面
                                        <div className="text-center py-8">
                                            <div className="w-20 h-20 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                                                <Icons.X className="w-10 h-10" />
                                            </div>
                                            <h3 className="text-2xl font-bold text-slate-800 mb-2">哎呀，答錯了！</h3>
                                            <p className="text-slate-600 mb-6">必須連續答對 {currentQuizQuestions.length} 題才能解鎖提示喔。</p>
                                            <button 
                                                onClick={retryQuiz}
                                                className="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-8 rounded-full transition-colors shadow-lg active:transform active:scale-95"
                                            >
                                                重新挑戰
                                            </button>
                                        </div>
                                    ) : (
                                        // 答題畫面
                                        <div className="animate-fade-in">
                                            <div className="flex items-center justify-between mb-6">
                                                <span className="text-xs font-bold text-blue-600 bg-blue-100 px-2 py-1 rounded-full uppercase tracking-wide">
                                                    解鎖挑戰
                                                </span>
                                                <span className="text-sm font-medium text-slate-400">
                                                    問題 {currentQuestionIndex + 1} / {currentQuizQuestions.length}
                                                </span>
                                            </div>
                                            
                                            <h3 className="text-xl font-bold text-slate-800 mb-6 leading-relaxed">
                                                {currentQuizQuestions[currentQuestionIndex].q}
                                            </h3>

                                            <div className="space-y-3">
                                                {currentQuizQuestions[currentQuestionIndex].options.map((option, idx) => (
                                                    <button
                                                        key={idx}
                                                        onClick={() => handleAnswer(idx)}
                                                        disabled={quizFeedback === 'correct'}
                                                        className={`w-full text-left p-4 rounded-xl border-2 transition-all font-medium flex items-center
                                                            ${quizFeedback === 'correct' && idx === currentQuizQuestions[currentQuestionIndex].ans 
                                                                ? 'border-green-500 bg-green-50 text-green-700' 
                                                                : 'border-slate-100 hover:border-blue-400 hover:bg-blue-50 text-slate-700'
                                                            }
                                                        `}
                                                    >
                                                        <div className={`w-6 h-6 rounded-full border-2 mr-3 flex items-center justify-center flex-shrink-0
                                                            ${quizFeedback === 'correct' && idx === currentQuizQuestions[currentQuestionIndex].ans 
                                                                ? 'border-green-500 bg-green-500 text-white' 
                                                                : 'border-slate-300'
                                                            }
                                                        `}>
                                                            {quizFeedback === 'correct' && idx === currentQuizQuestions[currentQuestionIndex].ans && <Icons.CheckCircle className="w-4 h-4" />}
                                                        </div>
                                                        {option}
                                                    </button>
                                                ))}
                                            </div>
                                            
                                            {quizFeedback === 'correct' && (
                                                <div className="mt-4 text-center text-green-600 font-bold animate-fade-in">
                                                    答對了！{currentQuestionIndex < currentQuizQuestions.length - 1 ? "下一題..." : "正在解鎖..."}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                        
                        {/* 圖片燈箱 Modal (解鎖後顯示，支援多圖切換) */}
                        {isImageModalOpen && selectedUnit && (
                            <div 
                                className="fixed inset-0 z-[120] bg-black/90 flex items-center justify-center p-4 animate-fade-in backdrop-blur-sm"
                                onClick={() => setIsImageModalOpen(false)}
                            >
                                <div className="relative max-w-6xl w-full h-full flex flex-col items-center justify-center pointer-events-none">
                                    {/* 關閉按鈕 */}
                                    <button 
                                        className="absolute top-4 right-4 md:top-0 md:-right-12 text-white/70 hover:text-white transition-colors pointer-events-auto bg-black/50 md:bg-transparent p-2 rounded-full z-20"
                                        onClick={() => setIsImageModalOpen(false)}
                                    >
                                        <Icons.X className="w-8 h-8 md:w-10 md:h-10" />
                                    </button>

                                    {/* 大圖容器 */}
                                    <div className="relative w-full h-full flex items-center justify-center">
                                        
                                        {/* 上一張按鈕 */}
                                        {selectedUnit.uploadLinks.length > 1 && (
                                            <button 
                                                className={`absolute left-0 md:-left-16 p-2 text-white/70 hover:text-white transition-colors pointer-events-auto bg-black/30 md:bg-transparent rounded-full z-20 ${currentHintIndex === 0 ? 'opacity-30 cursor-not-allowed' : ''}`}
                                                onClick={prevImage}
                                                disabled={currentHintIndex === 0}
                                            >
                                                <Icons.ChevronLeft className="w-10 h-10 md:w-16 md:h-16" />
                                            </button>
                                        )}

                                        {/* 圖片本體 */}
                                        <img 
                                            src={`${selectedUnit.uploadLinks[currentHintIndex]}?raw=true`} 
                                            alt={`解題提示 ${currentHintIndex + 1}`} 
                                            className="max-w-full max-h-[80vh] md:max-h-[85vh] object-contain rounded-lg shadow-2xl pointer-events-auto bg-white no-copy select-none"
                                            onClick={(e) => e.stopPropagation()} 
                                            draggable="false"
                                            onContextMenu={(e) => e.preventDefault()}
                                        />

                                        {/* 下一張按鈕 */}
                                        {selectedUnit.uploadLinks.length > 1 && (
                                            <button 
                                                className={`absolute right-0 md:-right-16 p-2 text-white/70 hover:text-white transition-colors pointer-events-auto bg-black/30 md:bg-transparent rounded-full z-20 ${currentHintIndex === selectedUnit.uploadLinks.length - 1 ? 'opacity-30 cursor-not-allowed' : ''}`}
                                                onClick={nextImage}
                                                disabled={currentHintIndex === selectedUnit.uploadLinks.length - 1}
                                            >
                                                <Icons.ChevronRight className="w-10 h-10 md:w-16 md:h-16" />
                                            </button>
                                        )}
                                    </div>
                                    
                                    {/* 頁碼指示器 (僅在多圖時顯示) */}
                                    {selectedUnit.uploadLinks.length > 1 && (
                                        <div className="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-black/60 text-white px-4 py-2 rounded-full text-sm font-bold tracking-widest backdrop-blur-md pointer-events-auto">
                                            {currentHintIndex + 1} / {selectedUnit.uploadLinks.length}
                                        </div>
                                    )}
                                    
                                    <p className="text-white/80 mt-4 text-sm font-medium md:block hidden">
                                        恭喜通關！{selectedUnit.uploadLinks.length > 1 ? "點擊左右箭頭切換圖片，" : ""}點擊背景或關閉按鈕以返回
                                    </p>
                                </div>
                            </div>
                        )}
                    </main>
                    
                    {/* Footer */}
                    <footer className="bg-slate-800 text-slate-400 py-8 mt-auto border-t border-slate-700">
                        <div className="max-w-6xl mx-auto px-4 text-center">
                            <p className="mb-2 font-medium text-slate-300">Scratch 創意程式設計教學平台</p>
                            <p className="text-sm">©Copyright QFM Computer Science</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ScratchPortal />);
    </script>
</body>
</html>
