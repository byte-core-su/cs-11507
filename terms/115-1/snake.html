<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>貪食蛇 Snake</title>
<script defer src="../../shared/site-shell.js"></script>
<style>
  :root{
    --bg-1:#dbeafe;          /* 粉藍背景 */
    --bg-2:#e0e7ff;
    --bg-3:#fce7f3;          /* 一點粉色點綴 */
    --glass:rgba(255,255,255,.45);
    --glass-border:rgba(255,255,255,.65);
    --ink:#1e3a5f;           /* 主文字:深藍 */
    --ink-soft:#5b7a9d;      /* 次文字 */
    --snake-1:#60a5fa;       /* 蛇頭 */
    --snake-2:#93c5fd;       /* 蛇身 */
    --food:#f9a8d4;          /* 食物:粉色 */
    --food-core:#ec4899;
    --accent:#3b82f6;        /* 按鈕主色 */
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro TC", "PingFang TC",
                "Noto Sans TC", "Segoe UI", sans-serif;
    min-height:100vh;
    display:flex;justify-content:center;align-items:center;
    padding:16px;
    background:linear-gradient(150deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
    position:relative;overflow-x:hidden;
  }
  /* 背景漂浮光暈,讓玻璃有東西可以「透」 */
  .blob{
    position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;
    pointer-events:none;z-index:0;
  }
  .blob.b1{width:340px;height:340px;background:#93c5fd;top:-80px;left:-80px;}
  .blob.b2{width:300px;height:300px;background:#f9a8d4;bottom:-60px;right:-60px;}
  .blob.b3{width:240px;height:240px;background:#c4b5fd;top:45%;left:65%;}

  /* ===== 玻璃卡片 ===== */
  .card{
    position:relative;z-index:1;
    width:min(430px, 100%);
    background:var(--glass);
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    border:1px solid var(--glass-border);
    border-radius:32px;
    box-shadow:0 20px 60px rgba(96,165,250,.25), inset 0 1px 0 rgba(255,255,255,.7);
    padding:22px 22px 24px;
  }
  .top{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;
  }
  .top h1{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:1px;}
  .top .sub{font-size:12px;color:var(--ink-soft);}

  /* HUD 三個小玻璃膠囊 */
  .hud{display:flex;gap:10px;margin-bottom:14px;}
  .pill{
    flex:1;text-align:center;
    background:rgba(255,255,255,.5);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.7);
    border-radius:18px;padding:8px 4px;
    box-shadow:0 4px 14px rgba(96,165,250,.15);
  }
  .pill .label{font-size:11px;color:var(--ink-soft);margin-bottom:2px;}
  .pill .value{font-size:18px;font-weight:700;color:var(--ink);}
  .pill .value small{font-size:11px;font-weight:600;color:var(--ink-soft);display:block;}

  /* ===== 遊戲區 ===== */
  .board{
    position:relative;
    border-radius:24px;overflow:hidden;
    background:rgba(255,255,255,.35);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:inset 0 2px 10px rgba(96,165,250,.12);
  }
  canvas{display:block;width:100%;height:auto;}

  .overlay{
    position:absolute;inset:0;z-index:2;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;gap:12px;padding:24px;
    background:rgba(255,255,255,.45);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
  }
  .overlay.hidden{display:none;}
  .overlay .emoji{font-size:44px;}
  .overlay h2{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:2px;}
  .overlay p{font-size:14px;color:var(--ink);line-height:1.7;font-weight:500;}
  .overlay .small{font-size:12px;color:var(--ink-soft);font-weight:400;}
  .cta{
    font-family:inherit;font-size:16px;font-weight:700;letter-spacing:2px;
    color:#fff;background:linear-gradient(135deg, var(--accent), #6366f1);
    border:none;border-radius:22px;padding:13px 36px;cursor:pointer;
    box-shadow:0 8px 22px rgba(59,130,246,.4);
    transition:transform .12s, box-shadow .12s;
  }
  .cta:active{transform:scale(.95);box-shadow:0 4px 12px rgba(59,130,246,.35);}

  .levelup{
    position:absolute;top:14px;left:50%;transform:translateX(-50%) translateY(-6px);
    z-index:3;pointer-events:none;
    background:rgba(255,255,255,.65);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.8);
    border-radius:999px;padding:7px 18px;
    font-size:14px;font-weight:700;color:var(--accent);
    box-shadow:0 6px 18px rgba(96,165,250,.3);
    opacity:0;transition:opacity .25s, transform .25s;
  }
  .levelup.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ===== 控制區 ===== */
  .controls{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:14px;}
  .dpad{
    display:grid;
    grid-template-columns:repeat(3, 54px);
    grid-template-rows:repeat(3, 54px);
    gap:6px;
  }
  .dpad button{
    background:rgba(255,255,255,.5);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.75);
    border-radius:16px;color:var(--accent);
    font-size:18px;cursor:pointer;
    box-shadow:0 4px 12px rgba(96,165,250,.18);
    transition:transform .1s;
    display:flex;align-items:center;justify-content:center;
  }
  .dpad button:active{transform:scale(.9);background:rgba(255,255,255,.75);}
  .dpad .blank{visibility:hidden;}
  .side-btns{display:flex;flex-direction:column;gap:12px;align-items:flex-end;}
  .side-btns button{
    font-family:inherit;font-size:14px;font-weight:600;letter-spacing:2px;
    color:var(--ink);
    background:rgba(255,255,255,.5);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.75);
    border-radius:999px;padding:12px 24px;cursor:pointer;
    box-shadow:0 4px 12px rgba(96,165,250,.18);
    transition:transform .1s;
  }
  .side-btns button:active{transform:scale(.94);}
  .hint{margin-top:14px;text-align:center;color:var(--ink-soft);font-size:11px;line-height:1.7;}
  .copyright{margin-top:8px;text-align:center;color:var(--ink-soft);font-size:10px;}

  @media (min-width:600px){
    .dpad{display:none;}
    .controls{justify-content:center;}
    .side-btns{flex-direction:row;}
  }
  @media (prefers-reduced-motion:reduce){
    .levelup,.cta,.dpad button,.side-btns button{transition:none;}
  }
</style>
  <script src="../../firebase-config.js"></script>
  <script src="../../shared/learner-profile.js"></script>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div class="card">
  <div class="top">
    <h1>🐍 貪食蛇</h1>
    <span class="sub">Snake · 運算思維</span>
  </div>

  <div class="hud">
    <div class="pill"><div class="label">分數</div><div class="value" id="score">0</div></div>
    <div class="pill"><div class="label">等級</div><div class="value">Lv.<span id="level">1</span><small id="rank">見習小蛇</small></div></div>
    <div class="pill"><div class="label">最高分</div><div class="value" id="best">0</div></div>
  </div>

  <div class="board">
    <canvas id="game" width="400" height="400"></canvas>

    <div class="overlay" id="startOverlay">
      <div class="emoji">🐍</div>
      <h2>貪食蛇</h2>
      <p>吃掉 🍩 讓蛇變長<br>每吃 5 個升一級,速度加快!</p>
      <p class="small">電腦:方向鍵 / WASD,空白鍵暫停<br>手機:滑動螢幕或按下方按鈕</p>
      <button class="cta" id="startBtn">開始遊戲</button>
    </div>

    <div class="overlay hidden" id="gameOverOverlay">
      <div class="emoji" id="overEmoji">💫</div>
      <h2>遊戲結束</h2>
      <p id="finalStats"></p>
      <p class="small" id="finalTip"></p>
      <button class="cta" id="restartBtn">再挑戰一次</button>
    </div>

    <div class="overlay hidden" id="pauseOverlay">
      <div class="emoji">⏸️</div>
      <h2>暫停中</h2>
      <p class="small">按空白鍵或「繼續」回到遊戲</p>
      <button class="cta" id="resumeBtn">繼續</button>
    </div>

    <div class="levelup" id="levelup">⬆️ LEVEL UP!</div>
  </div>

  <div class="controls">
    <div class="dpad">
      <button class="blank"></button>
      <button data-dir="up" aria-label="上">▲</button>
      <button class="blank"></button>
      <button data-dir="left" aria-label="左">◀</button>
      <button class="blank"></button>
      <button data-dir="right" aria-label="右">▶</button>
      <button class="blank"></button>
      <button data-dir="down" aria-label="下">▼</button>
      <button class="blank"></button>
    </div>
    <div class="side-btns">
      <button id="pauseBtn">暫停</button>
      <button id="resetBtn">重來</button>
    </div>
  </div>

  <div class="hint">108課綱運算思維示範教材|核心概念:座標系統・陣列・碰撞偵測・遊戲迴圈</div>
  <p class="copyright">© 115 學年度上學期資訊科技 · QFM Computer Science</p>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // ===== 遊戲設定(座標系統:把畫面切成 20×20 的格子)=====
  const GRID = 20;                     // 每邊格子數
  const CELL = canvas.width / GRID;    // 每格像素大小
  const FOOD_PER_LEVEL = 5;            // 每吃 5 個食物升一級
  const BASE_SPEED = 170;              // 起始速度(毫秒/步),數字越小越快
  const RANKS = ['見習小蛇','街頭快蛇','叢林獵蛇','傳說巨蟒','蛇界之神'];

  // ===== 遊戲狀態(用「變數」記住目前的一切)=====
  let snake, dir, nextDir, food, score, best = 0, level, eaten;
  let timer = null, running = false, paused = false;

  const $ = id => document.getElementById(id);

  function init() {
    // 蛇的身體是一個「陣列」,每一節是一個 {x, y} 座標
    snake = [{x:8,y:10},{x:7,y:10},{x:6,y:10}];
    dir = {x:1, y:0};        // 目前方向:向右
    nextDir = {x:1, y:0};
    score = 0; level = 1; eaten = 0;
    placeFood();
    updateHUD();
    draw();
  }

  // 隨機放食物(不能放在蛇身上 → 「重複直到」的邏輯)
  function placeFood() {
    do {
      food = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID)
      };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function speed() {
    // 每升一級,間隔縮短 12ms(速度變快),最快 60ms
    return Math.max(60, BASE_SPEED - (level - 1) * 12);
  }

  // ===== 遊戲迴圈:每隔一段時間走一步 =====
  function step() {
    dir = nextDir;
    // 新蛇頭 = 舊蛇頭 + 方向
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 碰撞偵測 1:撞牆(超出格子範圍)
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
      return gameOver('wall');
    }
    // 碰撞偵測 2:咬到自己的身體
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver('self');
    }

    snake.unshift(head);   // 頭部加一節(往前長)

    // 吃到食物?
    if (head.x === food.x && head.y === food.y) {
      score += 10 * level;   // 等級越高,分數加倍(遊戲化獎勵)
      eaten++;
      if (eaten % FOOD_PER_LEVEL === 0) levelUp();
      placeFood();
      // 不刪尾巴 → 蛇變長
    } else {
      snake.pop();           // 沒吃到 → 刪掉尾巴,長度不變
    }

    updateHUD();
    draw();
    timer = setTimeout(step, speed());
  }

  function levelUp() {
    level++;
    const badge = $('levelup');
    badge.textContent = '⬆️ LEVEL ' + level + '!';
    badge.classList.add('show');
    setTimeout(() => badge.classList.remove('show'), 900);
  }

  function updateHUD() {
    $('score').textContent = score;
    $('level').textContent = level;
    $('best').textContent = Math.max(best, score);
    $('rank').textContent = RANKS[Math.min(level - 1, RANKS.length - 1)];
  }

  // ===== 畫面繪製 =====
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 棋盤格:兩種若有似無的白,像 iOS 的柔和底紋
    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? 'rgba(255,255,255,.22)' : 'rgba(255,255,255,.08)';
        ctx.fillRect(x*CELL, y*CELL, CELL, CELL);
      }
    }

    // 食物 🍩:粉色圓點 + 光暈
    const fx = food.x*CELL + CELL/2, fy = food.y*CELL + CELL/2;
    const glow = ctx.createRadialGradient(fx, fy, 2, fx, fy, CELL*0.7);
    glow.addColorStop(0, 'rgba(236,72,153,.35)');
    glow.addColorStop(1, 'rgba(236,72,153,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(fx - CELL, fy - CELL, CELL*2, CELL*2);
    ctx.fillStyle = '#f9a8d4';
    ctx.beginPath(); ctx.arc(fx, fy, CELL*0.32, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ec4899';
    ctx.beginPath(); ctx.arc(fx, fy, CELL*0.16, 0, Math.PI*2); ctx.fill();

    // 蛇身:用「重複」畫出陣列中的每一節,顏色由頭到尾漸淡
    const n = snake.length;
    snake.forEach((seg, i) => {
      const t = i / Math.max(n - 1, 1);            // 0(頭)→ 1(尾)
      // 從 #3b82f6(頭)漸變到 #bfdbfe(尾)
      const r = Math.round(59  + (191 - 59)  * t);
      const g = Math.round(130 + (219 - 130) * t);
      const b = Math.round(246 + (254 - 246) * t);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      const pad = i === 0 ? 1.5 : 2.5;
      roundRect(seg.x*CELL + pad, seg.y*CELL + pad, CELL - pad*2, CELL - pad*2, 6);
      ctx.fill();
      if (i === 0) { // 蛇眼:兩顆白點
        ctx.fillStyle = '#fff';
        const cx = seg.x*CELL + CELL/2, cy = seg.y*CELL + CELL/2;
        const ox = dir.y !== 0 ? 4 : 0, oy = dir.x !== 0 ? 4 : 0; // 垂直於前進方向排列
        ctx.beginPath(); ctx.arc(cx + dir.x*3 - ox, cy + dir.y*3 - oy, 2.2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + dir.x*3 + ox, cy + dir.y*3 + oy, 2.2, 0, Math.PI*2); ctx.fill();
      }
    });
  }

  // ===== 流程控制 =====
  function start() {
    $('startOverlay').classList.add('hidden');
    $('gameOverOverlay').classList.add('hidden');
    $('pauseOverlay').classList.add('hidden');
    clearTimeout(timer);
    init();
    running = true; paused = false;
    timer = setTimeout(step, speed());
  }

  function gameOver(reason) {
    running = false;
    clearTimeout(timer);
    const isNewBest = score > best;
    best = Math.max(best, score);
    $('overEmoji').textContent = isNewBest && score > 0 ? '🏆' : '💫';
    $('finalStats').innerHTML =
      '得分 ' + score + ' 分 ・ 長度 ' + snake.length + ' 節<br>最終等級 Lv.' + level +
      ' ' + RANKS[Math.min(level-1, RANKS.length-1)];
    $('finalTip').textContent = isNewBest && score > 0
      ? '🎉 新紀錄!你就是本場最強!'
      : (reason === 'wall' ? '剛才是「撞牆」——想想看程式怎麼判斷超出邊界?'
                           : '剛才是「咬到自己」——程式怎麼知道頭碰到身體?');
    updateHUD();
    $('gameOverOverlay').classList.remove('hidden');
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      clearTimeout(timer);
      $('pauseOverlay').classList.remove('hidden');
    } else {
      $('pauseOverlay').classList.add('hidden');
      timer = setTimeout(step, speed());
    }
  }

  // 換方向(規則:不能 180 度回頭 → 「如果…那麼」的判斷)
  function setDir(dx, dy) {
    if (dx === -dir.x && dy === -dir.y) return; // 禁止直接回頭
    nextDir = {x:dx, y:dy};
  }
  const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };

  // ===== 輸入:鍵盤 =====
  document.addEventListener('keydown', e => {
    const map = {
      ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
      w:'up', s:'down', a:'left', d:'right',
      W:'up', S:'down', A:'left', D:'right'
    };
    if (map[e.key]) {
      e.preventDefault();
      if (!paused) setDir(...DIRS[map[e.key]]);
    } else if (e.key === ' ') {
      e.preventDefault();
      togglePause();
    } else if (e.key === 'Enter' && !running) {
      start();
    }
  });

  // ===== 輸入:螢幕按鈕 =====
  document.querySelectorAll('.dpad [data-dir]').forEach(btn => {
    btn.addEventListener('click', () => { if (!paused) setDir(...DIRS[btn.dataset.dir]); });
  });
  $('pauseBtn').addEventListener('click', togglePause);
  $('resetBtn').addEventListener('click', start);
  $('startBtn').addEventListener('click', start);
  $('restartBtn').addEventListener('click', start);
  $('resumeBtn').addEventListener('click', togglePause);

  // ===== 輸入:手機滑動 =====
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, {passive:true});
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return; // 太短不算滑動
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  }, {passive:true});

  init(); // 先畫出初始畫面
})();
</script>
</body>
</html>
