<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一筆畫解謎：尋找真正的起點</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 設定 Import Map，讓瀏覽器能正確解析 React 與 jsx-runtime -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime"
        }
    }
    </script>
    
    <!-- 引入 Babel 以解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', sans-serif; }
        .grid-cell { transition: all 0.3s ease; }
        .arrow-icon { transition: transform 0.3s ease; }
        
        /* 證書動畫 */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .cert-animate {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        /* iOS 風格柔和漸層背景 (Mesh Gradient) */
        body {
            background-color: #f5f5f7; /* iOS 系統預設淺底色 */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(219, 234, 254, 0.8) 0%, transparent 50%),
                radial-gradient(circle at 90% 10%, rgba(252, 231, 243, 0.7) 0%, transparent 50%),
                radial-gradient(circle at 50% 90%, rgba(204, 251, 241, 0.7) 0%, transparent 60%);
            background-attachment: fixed;
        }
    </style>
    <script src="../../firebase-config.js"></script>
    <script src="../../shared/learner-profile.js"></script>
    <script src="../../shared/site-shell.js" defer></script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 text-slate-800">
    <div id="root" class="w-full flex justify-center"></div>

    <!-- 使用 data-type="module" 並改為原生的 ES Module 匯入方式 -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useCallback, useRef } from 'react';
        import { createRoot } from 'react-dom/client';

        // 取得相鄰格子的索引 (包含斜線)
        const getNeighbors = (index, size) => {
            const x = index % size;
            const y = Math.floor(index / size);
            const neighbors = [];
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    const nx = x + dx;
                    const ny = y + dy;
                    if (nx >= 0 && nx < size && ny >= 0 && ny < size) {
                        neighbors.push(ny * size + nx);
                    }
                }
            }
            return neighbors;
        };

        // 計算從 A 格子到 B 格子的方向與角度
        const getDirection = (from, to, size) => {
            const fromX = from % size;
            const fromY = Math.floor(from / size);
            const toX = to % size;
            const toY = Math.floor(to / size);
            const dx = toX - fromX;
            const dy = toY - fromY;
            
            let angle = 0;
            if (dx === 0 && dy === -1) angle = 0;         // 上
            else if (dx === 1 && dy === -1) angle = 45;   // 右上
            else if (dx === 1 && dy === 0) angle = 90;    // 右
            else if (dx === 1 && dy === 1) angle = 135;   // 右下
            else if (dx === 0 && dy === 1) angle = 180;   // 下
            else if (dx === -1 && dy === 1) angle = 225;  // 左下
            else if (dx === -1 && dy === 0) angle = 270;  // 左
            else if (dx === -1 && dy === -1) angle = 315; // 左上
            
            return { angle, dx, dy };
        };

        const App = () => {
            const [level, setLevel] = useState(1);
            const [grid, setGrid] = useState([]);
            const [path, setPath] = useState([]);
            const [status, setStatus] = useState('idle'); // idle, animating, success, fail
            const [message, setMessage] = useState('');
            const [showCert, setShowCert] = useState(null); // null, '3x3', '4x4', '5x5'
            const [lives, setLives] = useState(0); 
            const [score, setScore] = useState(0); 

            // 判斷目前的網格大小
            const currentSize = level <= 10 ? 3 : level <= 20 ? 4 : 5;
            const totalCells = currentSize * currentSize;
            
            // 由於非同步更新問題，使用 ref 確保在生成時拿到正確尺寸
            const sizeRef = useRef(currentSize);
            sizeRef.current = currentSize;

            // 生成新的謎題 (加入 Warnsdorff 啟發式演算法)
            const generatePuzzle = useCallback(() => {
                const size = sizeRef.current;
                const total = size * size;
                let finalPath = null;
                
                // 隨機打亂起點順序
                const startPoints = Array.from({length: total}, (_, i) => i).sort(() => Math.random() - 0.5);

                for (const start of startPoints) {
                    let dfsCount = 0;
                    
                    const dfs = (curr, visited, currentPath) => {
                        if (dfsCount++ > 10000) return null; // 安全逃脫機制
                        if (currentPath.length === total) return currentPath;
                        
                        // 找出尚未走訪的相鄰格子
                        let unvisitedNeighbors = getNeighbors(curr, size).filter(n => !visited.has(n));
                        
                        // 使用 Warnsdorff 規則
                        unvisitedNeighbors.sort((a, b) => {
                            const countA = getNeighbors(a, size).filter(n => !visited.has(n) && n !== a).length;
                            const countB = getNeighbors(b, size).filter(n => !visited.has(n) && n !== b).length;
                            if (countA === countB) return Math.random() - 0.5;
                            return countA - countB;
                        });

                        for (const n of unvisitedNeighbors) {
                            visited.add(n);
                            const res = dfs(n, visited, [...currentPath, n]);
                            if (res) return res;
                            visited.delete(n); // 回溯
                        }
                        return null;
                    };
                    
                    finalPath = dfs(start, new Set([start]), [start]);
                    if (finalPath) break; // 找到可行路徑即跳出
                }

                if (!finalPath) {
                    setTimeout(generatePuzzle, 0);
                    return;
                }

                const newGrid = new Array(total).fill(null);

                // 設定箭頭方向
                for (let i = 0; i < total - 1; i++) {
                    const from = finalPath[i];
                    const to = finalPath[i+1];
                    newGrid[from] = getDirection(from, to, size);
                }

                // 設定最後一格的箭頭方向 
                const last = finalPath[total - 1];
                const prev = finalPath[total - 2];
                const start = finalPath[0];
                const lastNeighbors = getNeighbors(last, size).filter(n => n !== start && n !== prev);
                
                // 取後備方案，確保一定有格子能指
                const target = lastNeighbors.length > 0 
                    ? lastNeighbors[Math.floor(Math.random() * lastNeighbors.length)] 
                    : prev; 
                    
                newGrid[last] = getDirection(last, target, size);

                setGrid(newGrid);
                setPath([]);
                setStatus('idle');
                setMessage('');
            }, []);

            // 關卡變更時重新生成謎題
            useEffect(() => {
                if (level <= 30) {
                    generatePuzzle();
                }
            }, [level, generatePuzzle]);

            // 處理點擊格子
            const handleCellClick = async (index) => {
                if (status === 'animating' || status === 'success') return;
                
                setStatus('animating');
                setPath([]);
                setMessage('');

                let currentPath = [];
                let visited = new Set();
                let curr = index;
                const size = sizeRef.current;

                // 逐步動畫演繹路徑
                while (!visited.has(curr)) {
                    visited.add(curr);
                    currentPath.push(curr);
                    setPath([...currentPath]);

                    // 動畫速度：格子越多，速度稍微加快
                    const delay = size === 5 ? 120 : size === 4 ? 180 : 250;
                    await new Promise(r => setTimeout(r, delay));

                    const dirData = grid[curr];
                    if (!dirData) break; // 防呆
                    
                    const nextX = (curr % size) + dirData.dx;
                    const nextY = Math.floor(curr / size) + dirData.dy;
                    curr = nextY * size + nextX;
                }

                // 判斷結果
                if (currentPath.length === totalCells) {
                    const nextLives = Math.min(lives + 1, 5); 
                    const baseScore = size === 3 ? 100 : size === 4 ? 1000 : 10000; 
                    const earnedScore = baseScore * nextLives; 

                    setStatus('success');
                    setMessage(`🎉 完美！正確解開第 ${level} 關！(+${earnedScore})`);
                    setLives(nextLives); 
                    setScore(prev => prev + earnedScore); 
                    
                    // 延遲一下顯示證書或等待玩家按下一關
                    setTimeout(() => {
                        if (level === 10) setShowCert('3x3');
                        else if (level === 20) setShowCert('4x4');
                        else if (level === 30) setShowCert('5x5');
                    }, 800);
                } else {
                    setStatus('fail');
                    setMessage(`❌ 只走了 ${currentPath.length} 步，請再試一次！`);
                    
                    setTimeout(() => {
                        setStatus(prevStatus => {
                            if (prevStatus !== 'success') {
                                setPath([]);
                                setMessage('');
                                return 'idle';
                            }
                            return prevStatus;
                        });
                    }, 1500);
                }
            };

            const nextLevel = () => {
                if (level < 30) {
                    setLevel(prev => prev + 1);
                }
            };

            const closeCertificate = () => {
                setShowCert(null);
                if (level < 30) {
                    setLevel(prev => prev + 1);
                }
            };

            // 樣式動態決定
            const gridColsClass = currentSize === 3 ? "grid-cols-3" : currentSize === 4 ? "grid-cols-4" : "grid-cols-5";
            const gapClass = currentSize === 3 ? "gap-3" : currentSize === 4 ? "gap-2" : "gap-1";
            const roundedClass = currentSize === 3 ? "rounded-xl" : currentSize === 4 ? "rounded-lg" : "rounded-md";
            const paddingClass = currentSize === 5 ? "p-1" : "p-2";

            return (
                <div className="w-full max-w-md flex flex-col items-center">
                    <div className="w-full bg-white/95 backdrop-blur-xl rounded-3xl shadow-[0_20px_60px_rgba(0,0,0,0.05)] border border-white p-6 sm:p-8 flex flex-col items-center relative overflow-hidden">
                        
                        {/* 頂部狀態列：生命值 (愛心) 與分數 */}
                        <div className="flex justify-between items-center w-full mb-4 px-1">
                            {/* 愛心區塊 */}
                            <div className="flex gap-1.5">
                                {[...Array(5)].map((_, i) => (
                                    <svg 
                                        key={i} 
                                        xmlns="http://www.w3.org/2000/svg" 
                                        width="28" 
                                        height="28" 
                                        viewBox="0 0 24 24" 
                                        fill={i < lives ? "#ef4444" : "none"} 
                                        stroke={i < lives ? "#ef4444" : "#cbd5e1"} 
                                        strokeWidth="2" 
                                        strokeLinecap="round" 
                                        strokeLinejoin="round"
                                        className="transition-all duration-300 transform hover:scale-110 drop-shadow-sm"
                                    >
                                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                                    </svg>
                                ))}
                            </div>
                            {/* 分數區塊 */}
                            <div className="flex flex-col items-end">
                                <span className="text-xs font-bold text-slate-400 leading-none mb-1 tracking-widest">SCORE</span>
                                <span className="text-2xl font-black text-blue-600 font-mono leading-none drop-shadow-sm">
                                    {score.toLocaleString()}
                                </span>
                            </div>
                        </div>

                        {/* 進度條 */}
                        <div className="w-full mb-6">
                            <div className="flex justify-between items-center text-sm font-bold text-slate-500 mb-2">
                                <span>第 {level} 關 <span className="text-slate-400">/ 30</span></span>
                                <span className="text-blue-700 bg-blue-50 px-2 py-1 rounded-md border border-blue-200 shadow-sm">
                                    難度: {currentSize}x{currentSize}
                                </span>
                            </div>
                            <div className="w-full bg-slate-100 rounded-full h-2.5 shadow-inner">
                                <div className="bg-gradient-to-r from-blue-500 to-indigo-500 h-2.5 rounded-full transition-all duration-500 ease-out shadow-sm" 
                                     style={{ width: `${(level / 30) * 100}%` }}>
                                </div>
                            </div>
                        </div>

                        <h1 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 mb-2 tracking-widest drop-shadow-sm uppercase">
                            一筆畫解謎
                        </h1>
                        <p className="text-slate-500 text-sm mb-6 text-center">
                            找出<b>唯一的起點</b>，順著方向走遍所有陣列。
                        </p>

                        {/* 動態棋盤 */}
                        <div className={`grid ${gridColsClass} ${gapClass} w-full aspect-square max-w-[320px] mb-6 relative mx-auto`}>
                            {grid.map((directionData, index) => {
                                const isActive = path.includes(index);
                                const isHead = path[path.length - 1] === index;
                                
                                let cellStyles = "bg-white border-2 border-slate-200 text-slate-400 hover:bg-slate-50 hover:border-slate-300 transition-colors duration-300";
                                if (isActive) {
                                    if (status === 'success') {
                                        cellStyles = "bg-emerald-500 border-emerald-600 text-white shadow-lg transform scale-105 z-10";
                                    } else if (status === 'fail') {
                                        cellStyles = "bg-rose-500 border-rose-600 text-white shadow-md z-10";
                                    } else {
                                        cellStyles = "bg-blue-500 border-blue-600 text-white shadow-md z-10";
                                    }
                                }

                                const headStyles = isHead && status === 'animating' ? "animate-pulse scale-110 shadow-lg" : "";

                                return (
                                    <div 
                                        key={index}
                                        onClick={() => handleCellClick(index)}
                                        className={`grid-cell flex items-center justify-center ${roundedClass} cursor-pointer ${cellStyles} ${headStyles} ${paddingClass}`}
                                    >
                                        {directionData !== null && (
                                            <svg 
                                                xmlns="http://www.w3.org/2000/svg" 
                                                viewBox="0 0 24 24" 
                                                fill="none" 
                                                stroke="currentColor" 
                                                strokeWidth="3" 
                                                strokeLinecap="round" 
                                                strokeLinejoin="round"
                                                className="w-full h-full max-w-[32px] max-h-[32px] transition-transform duration-300"
                                                style={{ transform: `rotate(${directionData.angle}deg)` }}
                                            >
                                                <line x1="12" y1="19" x2="12" y2="5"></line>
                                                <polyline points="5 12 12 5 19 12"></polyline>
                                            </svg>
                                        )}
                                    </div>
                                );
                            })}
                        </div>

                        {/* 訊息提示 */}
                        <div className="h-8 flex items-center justify-center w-full mb-4">
                            <p className={`text-center font-bold tracking-wide ${status === 'success' ? 'text-emerald-600' : 'text-rose-500'}`}>
                                {message}
                            </p>
                        </div>

                        {/* 控制按鈕 */}
                        <div className="flex gap-3 w-full max-w-[280px]">
                            {status === 'success' && level < 30 && !showCert ? (
                                <button 
                                    onClick={nextLevel}
                                    className="flex-1 py-3 bg-gradient-to-r from-emerald-500 to-emerald-400 text-white rounded-xl font-bold text-lg hover:from-emerald-400 hover:to-emerald-300 transition-all shadow-lg shadow-emerald-200 animate-bounce"
                                >
                                    前往下一陣列
                                </button>
                            ) : (
                                <button 
                                    onClick={generatePuzzle}
                                    disabled={status === 'animating' || level === 30 && status === 'success'}
                                    className="flex-1 py-3 bg-slate-800 border border-slate-700 text-white rounded-xl font-bold hover:bg-slate-700 disabled:opacity-50 transition-all shadow-md"
                                >
                                    重組陣列
                                </button>
                            )}
                        </div>

                        {/* 證書 Modal */}
                        {showCert && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
                                <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-sm w-full border border-yellow-200 cert-animate text-center relative overflow-hidden">
                                    <div className="absolute top-[-50px] left-[-50px] w-40 h-40 bg-yellow-100 rounded-full mix-blend-multiply filter blur-xl"></div>
                                    <div className="absolute bottom-[-50px] right-[-50px] w-40 h-40 bg-amber-100 rounded-full mix-blend-multiply filter blur-xl"></div>
                                    
                                    <div className="text-6xl mb-4 relative z-10 drop-shadow-sm">
                                        {showCert === '3x3' ? '⭐' : showCert === '4x4' ? '🌟' : '🏆'}
                                    </div>
                                    <h2 className="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-500 to-orange-500 mb-2 relative z-10">
                                        {showCert === '3x3' ? '初級解謎大師' : showCert === '4x4' ? '中級解謎大師' : '傳奇解謎大師'}
                                    </h2>
                                    <p className="text-slate-600 font-medium mb-8 relative z-10 leading-relaxed">
                                        {showCert === '3x3' && '恭喜你成功突破所有 3x3 試煉，即將面對更困難的 4x4 迷陣！'}
                                        {showCert === '4x4' && '太驚人了！你征服了 4x4 迷陣，最終的 5x5 地獄難度已為你開啟！'}
                                        {showCert === '5x5' && '不可思議的智慧！你完全通關了 30 關挑戰，成為了一筆畫的傳奇大師！'}
                                    </p>
                                    <button 
                                        onClick={closeCertificate}
                                        className="w-full py-3 bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-xl font-bold text-lg hover:from-amber-400 hover:to-orange-400 shadow-lg shadow-orange-200 transform transition active:scale-95 relative z-10"
                                    >
                                        {showCert === '5x5' ? '榮耀歸來 (重新回味)' : '領取證書並前往下一階'}
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                    
                    {/* 頁尾版權宣告 */}
                    <footer className="mt-8 mb-2 text-slate-400 text-xs sm:text-sm font-medium tracking-widest text-center">
                        © Copyright QFM Computer Science
                    </footer>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
