<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式測驗遊戲 - 知識大擂台</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入字體：黑體(粗) 讓字體更有綜藝節目的張力 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- 引入 Firebase SDK (版本 8，較易於單檔使用) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f172a; 
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.4) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(139, 92, 246, 0.3) 0%, transparent 60%);
            color: #f8fafc;
            overflow-x: hidden;
        }
        
        .hidden-screen {
            display: none !important;
        }

        /* 綜藝節目主舞台面板 */
        .tv-panel {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%);
            border: 2px solid rgba(96, 165, 250, 0.3);
            box-shadow: 
                0 0 30px rgba(0, 0, 0, 0.8), 
                inset 0 0 20px rgba(96, 165, 250, 0.1),
                0 0 15px rgba(59, 130, 246, 0.4); 
            backdrop-filter: blur(12px);
        }

        .title-text {
            font-weight: 900;
            background: linear-gradient(to bottom, #fef08a 0%, #eab308 50%, #b45309 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.8));
            letter-spacing: 2px;
        }

        .btn-3d {
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            transform: translateY(0);
        }
        .btn-3d:active:not(:disabled) {
            transform: translateY(6px); 
        }
        .btn-3d.bg-green-500 { box-shadow: 0 6px 0 #166534, 0 8px 10px rgba(0,0,0,0.5); }
        .btn-3d.bg-green-500:active { box-shadow: 0 0px 0 #166534, 0 2px 5px rgba(0,0,0,0.5); }
        
        .btn-3d.bg-yellow-500 { box-shadow: 0 6px 0 #854d0e, 0 8px 10px rgba(0,0,0,0.5); }
        .btn-3d.bg-yellow-500:active { box-shadow: 0 0px 0 #854d0e, 0 2px 5px rgba(0,0,0,0.5); }
        
        .btn-3d.bg-red-500 { box-shadow: 0 6px 0 #991b1b, 0 8px 10px rgba(0,0,0,0.5); }
        .btn-3d.bg-red-500:active { box-shadow: 0 0px 0 #991b1b, 0 2px 5px rgba(0,0,0,0.5); }
        
        .btn-3d.bg-blue-600 { box-shadow: 0 6px 0 #1e3a8a, 0 8px 10px rgba(0,0,0,0.5); }
        .btn-3d.bg-blue-600:active:not(:disabled) { box-shadow: 0 0px 0 #1e3a8a, 0 2px 5px rgba(0,0,0,0.5); }
        
        .btn-3d.bg-purple-600 { box-shadow: 0 6px 0 #581c87, 0 8px 10px rgba(0,0,0,0.5); }
        .btn-3d.bg-purple-600:active:not(:disabled) { box-shadow: 0 0px 0 #581c87, 0 2px 5px rgba(0,0,0,0.5); }
        
        .btn-3d.bg-slate-600 { box-shadow: 0 6px 0 #334155, 0 8px 10px rgba(0,0,0,0.5); }
        .btn-3d.bg-slate-600:active:not(:disabled) { box-shadow: 0 0px 0 #334155, 0 2px 5px rgba(0,0,0,0.5); }

        .btn-3d:disabled { transform: translateY(6px); box-shadow: none; opacity: 0.7; }

        .option-tv {
            background: linear-gradient(to right, #1e293b, #0f172a);
            border: 2px solid #334155;
            color: #cbd5e1;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }
        .option-tv:hover {
            border-color: #60a5fa;
            background: linear-gradient(to right, #1e3a8a, #172554);
            color: #fff;
            transform: scale(1.01);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }
        .option-tv.selected {
            background: linear-gradient(to right, #ea580c, #c2410c); 
            border-color: #fb923c;
            color: #fff;
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(234, 88, 12, 0.6), 0 4px 0 #9a3412; 
        }
        .option-tv.selected:active {
            transform: scale(1.03) translateY(4px);
            box-shadow: 0 0 20px rgba(234, 88, 12, 0.6), 0 0px 0 #9a3412;
        }

        .neon-score {
            font-family: monospace;
            color: #22d3ee; 
            text-shadow: 0 0 5px #22d3ee, 0 0 10px #22d3ee, 0 0 20px #0891b2;
        }

        .timer-bar {
            transition: width 1s linear, background-color 0.3s ease, box-shadow 0.3s ease;
        }
        .timer-glow-green { box-shadow: 0 0 15px #4ade80; }
        .timer-glow-yellow { box-shadow: 0 0 15px #facc15; }
        .timer-glow-red { box-shadow: 0 0 15px #f87171; }

        @keyframes pulse-heart {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(239, 68, 68, 0.8)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 15px rgba(239, 68, 68, 1)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(239, 68, 68, 0.8)); }
        }
        .heart-icon {
            display: inline-block;
            color: #ef4444; 
            font-size: 1.5rem;
            margin-right: 4px;
            animation: pulse-heart 1.5s infinite;
        }
        .heart-lost {
            color: #334155; 
            text-decoration: line-through;
            opacity: 0.5;
            animation: none;
            filter: none;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-15px) rotate(-2deg); }
            40% { transform: translateX(15px) rotate(2deg); }
            60% { transform: translateX(-10px) rotate(-1deg); }
            80% { transform: translateX(10px) rotate(1deg); }
        }
        .screen-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .live-indicator {
            animation: blink 1.5s infinite;
        }
        
        /* 英雄榜表格樣式 */
        .leaderboard-table th, .leaderboard-table td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.75rem;
            text-align: center;
        }
        .leaderboard-table tr:last-child td {
            border-bottom: none;
        }
        .leaderboard-table tr:nth-child(1) td { color: #fef08a; font-weight: bold; } /* 第一名黃金 */
        .leaderboard-table tr:nth-child(2) td { color: #e2e8f0; font-weight: bold; } /* 第二名白銀 */
        .leaderboard-table tr:nth-child(3) td { color: #fed7aa; font-weight: bold; } /* 第三名青銅 */
    </style>
    <script src="../../firebase-config.js"></script>
    <script src="../../shared/learner-profile.js"></script>
    <script src="../../shared/site-shell.js" defer></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="fixed top-0 left-0 w-full h-full pointer-events-none z-0 flex justify-between px-10 pt-10">
        <div class="w-32 h-32 rounded-full bg-blue-600/20 blur-3xl"></div>
        <div class="w-32 h-32 rounded-full bg-purple-600/20 blur-3xl"></div>
    </div>

    <div id="main-container" class="tv-panel rounded-3xl w-full max-w-md overflow-hidden relative z-10 my-4">
        
        <!-- 左上角 LIVE 標籤 -->
        <div class="absolute top-4 left-4 flex items-center space-x-2 z-20">
            <div class="w-2.5 h-2.5 rounded-full bg-red-500 live-indicator shadow-[0_0_8px_#ef4444]"></div>
            <span class="text-xs font-bold text-red-400 tracking-wider">LIVE</span>
        </div>

        <div id="screen-start" class="p-8 text-center pt-16">
            <div class="mb-4 relative">
                <div class="absolute -top-6 -left-2 text-yellow-400 animate-pulse text-2xl">✨</div>
                <div class="absolute bottom-0 -right-2 text-yellow-400 animate-pulse text-xl" style="animation-delay: 0.5s">✨</div>
                
                <h1 class="text-5xl title-text mb-2">知識大擂台</h1>
                <h2 class="text-xl font-bold text-blue-300 tracking-widest mt-2">KNOWLEDGE QUIZ</h2>
            </div>
            
            <p class="text-slate-300 mb-6 font-medium">全新挑戰登場！<br>每題 <span class="text-yellow-400 text-lg font-bold">10</span> 秒，準備好稱霸全場了嗎？</p>
            
            <div class="space-y-4 mb-6">
                <button onclick="startGame('easy')" class="btn-3d w-full py-4 px-6 bg-green-500 text-white rounded-2xl font-black text-xl flex justify-between items-center border border-green-400">
                    <span class="tracking-widest">簡單模式</span>
                    <span class="text-sm bg-black/30 px-3 py-1.5 rounded-lg border border-white/20">3 條命 ❤️❤️❤️</span>
                </button>
                <button onclick="startGame('normal')" class="btn-3d w-full py-4 px-6 bg-yellow-500 text-white rounded-2xl font-black text-xl flex justify-between items-center border border-yellow-400">
                    <span class="tracking-widest">普通模式</span>
                    <span class="text-sm bg-black/30 px-3 py-1.5 rounded-lg border border-white/20">2 條命 ❤️❤️</span>
                </button>
                <button onclick="startGame('hard')" class="btn-3d w-full py-4 px-6 bg-red-500 text-white rounded-2xl font-black text-xl flex justify-between items-center border border-red-400">
                    <span class="tracking-widest">地獄模式</span>
                    <span class="text-sm bg-black/30 px-3 py-1.5 rounded-lg border border-white/20">1 條命 ❤️</span>
                </button>
            </div>
            
            <!-- 查看英雄榜按鈕 -->
            <button onclick="showLeaderboardScreen()" class="btn-3d w-full py-3 px-6 bg-purple-600 text-white rounded-2xl font-bold text-lg border border-purple-400">
                🏆 查看英雄榜
            </button>
        </div>

        <div id="screen-quiz" class="hidden-screen flex flex-col h-full">
            <div class="bg-slate-900/80 p-4 border-b border-slate-700 flex justify-between items-center pt-10">
                <div class="flex flex-col">
                    <span class="text-xs text-blue-400 uppercase font-black tracking-widest mb-1 shadow-sm">SCORE / 分數</span>
                    <span id="score-display" class="text-3xl font-black neon-score">0</span>
                </div>
                <div class="flex flex-col items-end">
                    <span class="text-xs text-red-400 uppercase font-black tracking-widest mb-1">LIVES / 生命</span>
                    <div id="lives-container" class="flex bg-black/40 px-2 py-1 rounded-lg border border-slate-700">
                    </div>
                </div>
            </div>

            <div class="h-2 w-full bg-slate-800 border-b border-slate-700/50">
                <div id="timer-bar" class="h-full bg-green-400 timer-bar timer-glow-green w-full"></div>
            </div>

            <div class="p-6 flex-grow relative">
                <div class="flex justify-between items-end mb-4">
                    <span class="text-sm font-bold text-slate-400 bg-slate-800 px-3 py-1 rounded-full border border-slate-700" id="question-counter">第 1 題 (剩餘 160 題)</span>
                    <div id="time-text-container" class="bg-slate-800 w-12 h-12 rounded-full flex items-center justify-center border-2 border-slate-600 shadow-[0_0_10px_rgba(0,0,0,0.5)]">
                        <span id="time-text" class="text-xl font-black text-white">10</span>
                    </div>
                </div>
                
                <div class="bg-gradient-to-b from-blue-900/40 to-slate-900/40 border border-blue-500/30 p-5 rounded-2xl mb-6 shadow-inner relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-500 to-transparent opacity-50"></div>
                    <h2 id="question-text" class="text-xl font-bold text-white mb-2 leading-relaxed tracking-wide text-shadow"></h2>
                </div>

                <div id="options-container" class="space-y-4"></div>
            </div>

            <div class="p-6 bg-slate-900/80 border-t border-slate-700/50">
                <button id="submit-btn" onclick="submitAnswer()" disabled class="btn-3d w-full py-4 bg-blue-600 disabled:bg-slate-700 disabled:text-slate-500 disabled:border-slate-600 text-white rounded-2xl font-black text-xl tracking-widest border border-blue-400">
                    確認送出 (LOCK IN)
                </button>
            </div>
            
            <div id="feedback-overlay" class="absolute inset-0 flex items-center justify-center bg-slate-900/90 hidden-screen backdrop-blur-md z-50">
                <div id="feedback-content" class="text-center transform scale-50 opacity-0 transition-all duration-300 ease-out w-full px-6"></div>
            </div>
        </div>

        <div id="screen-result" class="hidden-screen p-8 text-center pt-16">
            <div id="result-icon-container" class="mb-6 relative inline-block"></div>
            <h2 id="result-title" class="text-4xl font-black mb-2 text-white drop-shadow-lg">遊戲結束</h2>
            <p id="result-message" class="text-slate-300 mb-6 font-medium">本次挑戰最終結算：</p>
            
            <div class="bg-black/50 rounded-2xl p-6 mb-6 border border-slate-700 shadow-inner relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-blue-600/20 rounded-full blur-2xl"></div>
                
                <div class="text-sm text-blue-400 uppercase font-black tracking-widest mb-2">FINAL SCORE</div>
                <div id="final-score" class="text-5xl font-black text-yellow-400 drop-shadow-[0_0_15px_rgba(250,204,21,0.5)] mb-4">0</div>
                
                <div class="border-t border-slate-700/50 pt-4 mt-2 flex justify-around text-lg font-bold text-slate-300">
                    <div class="flex flex-col items-center">
                        <span class="text-xs text-slate-500 mb-1">答對</span>
                        <span id="correct-count" class="text-green-400 text-2xl">0</span>
                    </div>
                    <div class="w-px bg-slate-700"></div>
                    <div class="flex flex-col items-center">
                        <span class="text-xs text-slate-500 mb-1">答錯</span>
                        <span id="wrong-count" class="text-red-400 text-2xl">0</span>
                    </div>
                </div>
            </div>

            <div id="record-submission-area" class="mb-6 p-4 bg-purple-900/30 border border-purple-500/50 rounded-xl hidden-screen">
                <h3 class="text-yellow-400 font-bold mb-2">🎉 恭喜！您的分數進入前十名！</h3>
                <p class="text-xs text-slate-300 mb-3">請輸入學號登錄英雄榜 (限7位數且15開頭)</p>
                <div class="flex space-x-2">
                    <input type="text" id="student-id-input" placeholder="例如: 1512345" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white text-center font-mono focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400">
                    <button onclick="submitScoreToLeaderboard()" id="submit-score-btn" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg font-bold transition-colors shrink-0">登錄</button>
                </div>
                <p id="submission-error" class="text-red-400 text-xs mt-2 hidden-screen"></p>
                <p id="submission-success" class="text-green-400 text-sm mt-2 font-bold hidden-screen">✅ 登錄成功！</p>
            </div>

            <div class="space-y-3">
                <button onclick="showLeaderboardScreen()" class="btn-3d w-full py-3 bg-purple-600 text-white rounded-xl font-bold text-lg border border-purple-400">
                    查看英雄榜
                </button>
                <button onclick="showStartScreen()" class="btn-3d w-full py-3 bg-slate-600 text-white rounded-xl font-bold text-lg border border-slate-500">
                    回到首頁
                </button>
            </div>
        </div>

        <div id="screen-leaderboard" class="hidden-screen p-6 pt-16 flex flex-col h-[600px]">
            <h2 class="text-3xl font-black mb-6 text-center text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 drop-shadow-md">🏆 英雄榜</h2>
            
            <!-- 難度分頁按鈕 -->
            <div class="flex bg-slate-800 rounded-lg p-1 mb-6 border border-slate-700">
                <button onclick="loadLeaderboardData('easy')" id="tab-easy" class="flex-1 py-2 text-sm font-bold rounded-md text-slate-400 transition-colors">簡單</button>
                <button onclick="loadLeaderboardData('normal')" id="tab-normal" class="flex-1 py-2 text-sm font-bold rounded-md text-slate-400 transition-colors">普通</button>
                <button onclick="loadLeaderboardData('hard')" id="tab-hard" class="flex-1 py-2 text-sm font-bold rounded-md text-slate-400 transition-colors">困難</button>
            </div>

            <div class="flex-grow bg-slate-900/80 border border-slate-700 rounded-xl overflow-hidden relative">
                <div id="leaderboard-loading" class="absolute inset-0 flex items-center justify-center bg-slate-900/80 z-10 hidden-screen">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-500"></div>
                </div>
                
                <div class="overflow-y-auto h-full p-2">
                    <table class="w-full text-sm leaderboard-table">
                        <thead class="text-xs text-slate-400 bg-slate-800/50">
                            <tr>
                                <th class="w-16">排名</th>
                                <th>學號</th>
                                <th class="w-24">分數</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body">
                            <!-- 資料由 JS 動態填入 -->
                        </tbody>
                    </table>
                    <div id="leaderboard-empty" class="text-center text-slate-500 py-8 hidden-screen">尚無紀錄，成為第一位上榜者吧！</div>
                </div>
            </div>

            <button onclick="showStartScreen()" class="mt-6 btn-3d w-full py-3 bg-slate-600 text-white rounded-xl font-bold text-lg border border-slate-500 shrink-0">
                返回首頁
            </button>
        </div>

    </div>

    <script>
        // 【注意】請將這裡替換為您自己的 Firebase Config!
        // 您需要在 Firebase 控制台 -> 專案設定 -> 建立網頁應用程式 中取得
        const firebaseConfig = window.SCHOOL_APP && window.SCHOOL_APP.firebaseConfig;

        // 初始化 Firebase (確保只初始化一次)
        let db;
        let quizAuthReady = false;
        try {
            if (firebaseConfig && !firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            if (firebaseConfig) {
                firebase.auth().onAuthStateChanged(async (user) => {
                    quizAuthReady = Boolean(user);
                    db = user ? firebase.firestore() : null;
                    if (!user) return;
                    try {
                        const snapshot = await db.collection('users').doc(user.uid).get();
                        const tasks = snapshot.data()?.terms?.[window.SCHOOL_APP.currentTermId]?.tasks || {};
                        const required = ['1-2', '2-2', '3-2', '4-2', '5-2', '6-2', '7-2', '8-2'];
                        if (!required.every(taskId => tasks[taskId])) location.replace('infolife.html');
                    } catch (guardError) {
                        console.error('Knowledge arena access check failed:', guardError);
                        location.replace('infolife.html');
                    }
                });
            }
        } catch (error) {
            console.error("Firebase 初始化失敗:", error);
            // alert("Firebase 未正確設定，英雄榜功能將無法運作。");
        }

        function leaderboardRef(difficulty) {
            return db.collection('leaderboards')
                     .doc(window.SCHOOL_APP.currentTermId)
                     .collection('difficulties')
                     .doc(difficulty)
                     .collection('scores');
        }

        // --- 新挑戰題庫 (總共 160 題) ---
        const allQuestions = [
            // --- 第四章：個人資料保護與資訊安全 (60題) ---
            { question: "個人資料保護的主要目的是什麼?", options: ["避免人格權受侵害並促進合理利用個人資料", "只為政府收集資料提供依據", "強制所有公司公開個人資訊", "只規範電子資料的保存方式"], answer: 0 },
            { question: "以下哪一項屬於直接識別個人的資料?", options: ["姓名", "一般職務描述", "匿名統計數據", "模糊的地區資訊"], answer: 0 },
            { question: "在課本列出的個人資料類別中,下列哪一項被視為敏感資料?", options: ["病歷", "聯絡方式", "職業", "教育程度"], answer: 0 },
            { question: "哪一項屬於可用來間接識別個人的資料?", options: ["家庭狀況", "護照號碼", "身分證統一編碼", "指紋"], answer: 0 },
            { question: "下列關於個人資料蒐集的原則,哪一項最符合課本精神?", options: ["無限制蒐集以備未來使用", "公開所有資料以維持透明", "僅為特定合理目的蒐集必要資料", "蒐集後可無期限保存"], answer: 2 },
            { question: "哪一項不是課本列出的個人資料範例?", options: ["出生年月日", "天氣偏好", "聯絡方式", "犯罪前科"], answer: 1 },

            { question: "若作品標示「No Derivative Works」，代表什麼限制？", options: ["必須標示作者姓名", "僅限非商業用途", "衍生作品須相同授權", "禁止改作或製作衍生作品"], answer: 3 },
            { question: "教材建議使用免費資源時，應注意什麼？", options: ["只要免費就可任意改作", "確認並遵守原始授權條款", "免費資源皆為公有領域", "不用標示來源"], answer: 1 },
            { question: "CC 授權通常由哪幾種元素組合而成以形成不同授權條款？", options: ["僅署名與公有領域兩種元素", "版稅與專利授權", "署名、非商業、禁止改作、相同方式分享等元素", "地理限制與語言條款"], answer: 2 },
            { question: "把作品釋出為公有領域 (public domain) 最接近哪種 CC 工具？", options: ["CC0 (Creative Commons Zero)", "CC BY-NC", "CC BY-ND", "CC BY-SA"], answer: 0 },
            { question: "教材指出在課堂上使用 CC 授權素材時，第一步應該是什麼？", options: ["確認素材的授權類型與條款", "直接改作後再標示來源", "假設所有網路資源均可自由使用", "僅在非公開課堂使用即可"], answer: 0 },
            { question: "教材中提到著作權法補充資料，主要是為了幫助學生理解什麼？", options: ["如何註冊專利", "著作權與合理使用的實務範例", "商標註冊流程", "如何加密檔案"], answer: 1 },
            { question: "在教材中，使用 CC 授權素材時常見的錯誤觀念是什麼？", options: ["CC 授權不能在教育上使用", "所有授權都允許商業使用", "免費素材不代表可任意使用", "署名是可選項目"], answer: 2 },
            { question: "教材列出的免費資源網站不包含下列哪一項用途？", options: ["專門的程式語法教學影片平台", "創用 CC 搜尋入口", "提供可用於多媒體的音樂素材", "提供 CC0 免版權資源"], answer: 0 },
            { question: "教材提到以組合程式積木方式教學，這樣的教學重點為何？", options: ["強調記憶程式語法細節", "主要訓練硬體架設能力", "僅適合專業程式設計師", "透過積木化介面學習程式邏輯"], answer: 3 },
            { question: "教材中提到的著作合理使用補充範例，主要目的為何？", options: ["教導如何侵權獲利", "說明合理使用的實際範例與判斷", "提供免費音樂下載", "示範如何申請 CC 授權"], answer: 1 }
        ];

        let currentDifficulty = 'normal';
        let maxLives = 2;
        let currentLives = 2;
        let score = 0;
        let roundQuestionCount = 0;
        let selectedOptionIndex = null;
        let currentCorrectOptionIndex = null;
        
        let timeLeft = 10;
        const TIME_LIMIT = 10;
        let timerInterval = null;
        let timerStartTimestamp = 0;

        let correctAnswersCount = 0;
        let wrongAnswersCount = 0;

        let questionQueue = [];
        let totalQuestionsAtStart = 0;
        let isFinalScoreSubmittable = false;

        const screens = {
            start: document.getElementById('screen-start'),
            quiz: document.getElementById('screen-quiz'),
            result: document.getElementById('screen-result'),
            leaderboard: document.getElementById('screen-leaderboard')
        };
        const ui = {
            mainContainer: document.getElementById('main-container'),
            score: document.getElementById('score-display'),
            lives: document.getElementById('lives-container'),
            questionCounter: document.getElementById('question-counter'),
            timeText: document.getElementById('time-text'),
            timeContainer: document.getElementById('time-text-container'),
            timerBar: document.getElementById('timer-bar'),
            questionText: document.getElementById('question-text'),
            optionsContainer: document.getElementById('options-container'),
            submitBtn: document.getElementById('submit-btn'),
            feedbackOverlay: document.getElementById('feedback-overlay'),
            feedbackContent: document.getElementById('feedback-content')
        };

        // 洗牌陣列函式
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function showScreen(screenName) {
            Object.values(screens).forEach(screen => screen.classList.add('hidden-screen'));
            screens[screenName].classList.remove('hidden-screen');
        }

        function showStartScreen() {
            showScreen('start');
        }

        function showLeaderboardScreen() {
            showScreen('leaderboard');
            loadLeaderboardData('normal'); // 預設載入普通模式
        }

        function startGame(difficulty) {
            currentDifficulty = difficulty;
            switch(difficulty) {
                case 'easy': maxLives = 3; break;
                case 'normal': maxLives = 2; break;
                case 'hard': maxLives = 1; break;
            }
            
            currentLives = maxLives;
            score = 0;
            roundQuestionCount = 0;
            correctAnswersCount = 0;
            wrongAnswersCount = 0;
            
            if (questionQueue.length === 0) {
                questionQueue = shuffleArray([...allQuestions]);
            }
            totalQuestionsAtStart = questionQueue.length;
            
            updateUIState();
            renderLives();
            
            // 重置登錄表單狀態
            document.getElementById('record-submission-area').classList.add('hidden-screen');
            document.getElementById('submission-success').classList.add('hidden-screen');
            document.getElementById('submit-score-btn').disabled = false;
            document.getElementById('student-id-input').value = '';
            document.getElementById('student-id-input').disabled = false;
            
            showScreen('quiz');
            loadQuestion();
        }

        function loadQuestion() {
            if (currentLives <= 0) {
                endGame(false);
                return;
            }
            if (questionQueue.length === 0) {
                endGame(true);
                return;
            }

            roundQuestionCount++;
            const currentQ = questionQueue[0];
            
            selectedOptionIndex = null;
            currentCorrectOptionIndex = null;
            ui.submitBtn.disabled = true;
            ui.feedbackOverlay.classList.add('hidden-screen');
            ui.mainContainer.classList.remove('screen-shake'); 
            
            ui.questionCounter.textContent = `第 ${roundQuestionCount} 題 (剩餘 ${questionQueue.length} 題)`;
            ui.questionText.textContent = currentQ.question;
            
            let shuffledOptions = currentQ.options.map((text, index) => ({ text: text, originalIndex: index }));
            shuffledOptions = shuffleArray(shuffledOptions);
            currentCorrectOptionIndex = shuffledOptions.findIndex(opt => opt.originalIndex === currentQ.answer);
            
            ui.optionsContainer.innerHTML = '';
            shuffledOptions.forEach((optionObj, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-tv w-full text-left p-4 rounded-2xl font-bold text-lg tracking-wide flex items-center';
                
                const letterBadge = document.createElement('span');
                letterBadge.className = 'inline-block bg-slate-800 text-blue-400 w-8 h-8 rounded-full flex items-center justify-center mr-3 border border-blue-500/50 shadow-inner shrink-0';
                letterBadge.textContent = String.fromCharCode(65 + index); 
                
                const textSpan = document.createElement('span');
                textSpan.textContent = optionObj.text;
                
                btn.appendChild(letterBadge);
                btn.appendChild(textSpan);

                btn.onclick = () => selectOption(index, btn);
                ui.optionsContainer.appendChild(btn);
            });

            startTimer();
        }

        function selectOption(index, btnElement) {
            selectedOptionIndex = index;
            const options = ui.optionsContainer.querySelectorAll('.option-tv');
            options.forEach(opt => opt.classList.remove('selected'));
            btnElement.classList.add('selected');
            ui.submitBtn.disabled = false;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = TIME_LIMIT;
            updateTimerDisplay();
            timerStartTimestamp = Date.now();
            
            timerInterval = setInterval(() => {
                const elapsedSeconds = (Date.now() - timerStartTimestamp) / 1000;
                timeLeft = TIME_LIMIT - elapsedSeconds;

                if (timeLeft <= 0) {
                    timeLeft = 0;
                    clearInterval(timerInterval);
                    updateTimerDisplay();
                    handleTimeout();
                } else {
                    updateTimerDisplay();
                }
            }, 50);
        }

        function updateTimerDisplay() {
            const displaySeconds = Math.ceil(timeLeft);
            ui.timeText.textContent = displaySeconds;

            const percentage = (timeLeft / TIME_LIMIT) * 100;
            ui.timerBar.style.width = `${percentage}%`;

            if (percentage > 50) {
                ui.timerBar.className = 'h-full timer-bar bg-green-400 timer-glow-green';
                ui.timeContainer.className = 'bg-slate-800 w-12 h-12 rounded-full flex items-center justify-center border-2 border-slate-600 shadow-[0_0_10px_rgba(0,0,0,0.5)]';
                ui.timeText.className = 'text-xl font-black text-white';
            } else if (percentage > 25) {
                ui.timerBar.className = 'h-full timer-bar bg-yellow-400 timer-glow-yellow';
                ui.timeContainer.className = 'bg-yellow-500/20 w-12 h-12 rounded-full flex items-center justify-center border-2 border-yellow-500 shadow-[0_0_15px_rgba(234,179,8,0.5)]';
                ui.timeText.className = 'text-xl font-black text-yellow-400';
            } else {
                ui.timerBar.className = 'h-full timer-bar bg-red-500 timer-glow-red';
                ui.timeContainer.className = 'bg-red-500/30 w-12 h-12 rounded-full flex items-center justify-center border-2 border-red-500 shadow-[0_0_20px_rgba(239,68,68,0.8)] animate-pulse';
                ui.timeText.className = 'text-xl font-black text-red-400';
            }
        }

        function handleTimeout() {
            processAnswer(false, true);
        }

        function submitAnswer() {
            if (selectedOptionIndex === null) return;
            clearInterval(timerInterval);
            const isCorrect = selectedOptionIndex === currentCorrectOptionIndex;
            processAnswer(isCorrect, false);
        }

        function processAnswer(isCorrect, isTimeout) {
            clearInterval(timerInterval);
            ui.submitBtn.disabled = true;

            const answeredQ = questionQueue.shift();

            if (isCorrect) {
                const bonusSeconds = Math.ceil(timeLeft);
                const earnedScore = 1000 + (bonusSeconds * 100); 
                
                score += earnedScore;
                correctAnswersCount++;
                showFeedback('correct', earnedScore, bonusSeconds);
            } else {
                currentLives--;
                wrongAnswersCount++;
                questionQueue.push(answeredQ); 
                renderLives();
                showFeedback(isTimeout ? 'timeout' : 'wrong');
            }

            updateUIState();

            setTimeout(() => {
                if (currentLives <= 0) {
                    endGame(false);
                } else if (questionQueue.length === 0) {
                    endGame(true);
                } else {
                    loadQuestion();
                }
            }, 1800); 
        }

        function updateUIState() {
            ui.score.textContent = score.toLocaleString();
        }

        function renderLives() {
            ui.lives.innerHTML = '';
            for (let i = 0; i < maxLives; i++) {
                const heart = document.createElement('span');
                heart.textContent = '❤️';
                heart.className = i < currentLives ? 'heart-icon' : 'heart-icon heart-lost';
                ui.lives.appendChild(heart);
            }
        }

        function showFeedback(type, earnedScore = 0, bonusSeconds = 0) {
            ui.feedbackOverlay.classList.remove('hidden-screen');
            const content = ui.feedbackContent;
            
            content.classList.remove('scale-100', 'opacity-100', 'scale-50', 'opacity-0');
            void content.offsetWidth; 
            content.classList.add('scale-100', 'opacity-100');

            if (type === 'correct') {
                content.innerHTML = `
                    <div class="relative inline-block mb-6">
                        <div class="absolute inset-0 bg-green-500 rounded-full blur-3xl opacity-50 animate-pulse"></div>
                        <div class="relative w-40 h-40 bg-gradient-to-br from-green-400 to-green-600 rounded-full flex items-center justify-center mx-auto shadow-[0_0_50px_rgba(74,222,128,0.8)] border-4 border-white">
                            <span class="text-7xl text-white font-black drop-shadow-lg">⭕</span>
                        </div>
                    </div>
                    <h3 class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-b from-green-300 to-green-500 drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] mb-2 tracking-widest">正解！</h3>
                    <p class="text-green-300 font-black text-4xl tracking-widest mb-2">+${earnedScore.toLocaleString()} 分</p>
                    ${bonusSeconds > 0 ? `<p class="text-yellow-400 font-bold text-xl tracking-wide drop-shadow-md">極速加分: ${bonusSeconds}秒 × 100</p>` : ''}
                `;
            } else if (type === 'wrong') {
                ui.mainContainer.classList.add('screen-shake');
                content.innerHTML = `
                    <div class="relative inline-block mb-6">
                        <div class="absolute inset-0 bg-red-600 rounded-full blur-3xl opacity-60 animate-pulse"></div>
                        <div class="relative w-40 h-40 bg-gradient-to-br from-red-500 to-red-700 rounded-full flex items-center justify-center mx-auto shadow-[0_0_50px_rgba(239,68,68,0.8)] border-4 border-white">
                            <span class="text-7xl text-white font-black drop-shadow-lg">❌</span>
                        </div>
                    </div>
                    <h3 class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-b from-red-400 to-red-600 drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] mb-2 tracking-widest">錯誤！</h3>
                    <p class="text-red-300 font-black text-2xl tracking-widest">失去一命</p>
                `;
            } else if (type === 'timeout') {
                ui.mainContainer.classList.add('screen-shake');
                content.innerHTML = `
                    <div class="relative inline-block mb-6">
                        <div class="absolute inset-0 bg-yellow-500 rounded-full blur-3xl opacity-50 animate-pulse"></div>
                        <div class="relative w-40 h-40 bg-gradient-to-br from-yellow-400 to-yellow-600 rounded-full flex items-center justify-center mx-auto shadow-[0_0_50px_rgba(234,179,8,0.8)] border-4 border-white">
                            <svg class="w-20 h-20 text-white drop-shadow-lg" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                    </div>
                    <h3 class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-b from-yellow-300 to-yellow-500 drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] mb-2 tracking-widest">時間到！</h3>
                    <p class="text-yellow-300 font-black text-2xl tracking-widest">失去一命</p>
                `;
            }

            setTimeout(() => {
                content.classList.remove('scale-100', 'opacity-100');
                content.classList.add('scale-50', 'opacity-0');
            }, 1500);
        }

        async function endGame(isWin) {
            clearInterval(timerInterval);
            const resultIconContainer = document.getElementById('result-icon-container');
            const resultTitle = document.getElementById('result-title');
            
            if (!isWin) {
                ui.mainContainer.style.boxShadow = "0 0 50px rgba(239, 68, 68, 0.4)";
                ui.mainContainer.style.borderColor = "rgba(239, 68, 68, 0.5)";
                resultIconContainer.innerHTML = `
                    <div class="absolute inset-0 bg-red-600 rounded-full blur-2xl opacity-40"></div>
                    <div class="relative w-32 h-32 bg-slate-900 border-4 border-red-500 rounded-full flex items-center justify-center mx-auto shadow-[0_0_30px_rgba(239,68,68,0.6)]">
                        <span class="text-6xl">💀</span>
                    </div>
                `;
                resultTitle.textContent = "挑戰失敗";
                resultTitle.className = "text-5xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-b from-red-400 to-red-600 drop-shadow-lg tracking-widest";
            } else {
                ui.mainContainer.style.boxShadow = "0 0 50px rgba(250, 204, 21, 0.5)";
                ui.mainContainer.style.borderColor = "rgba(250, 204, 21, 0.6)";
                resultIconContainer.innerHTML = `
                    <div class="absolute inset-0 bg-yellow-400 rounded-full blur-2xl opacity-50"></div>
                    <div class="relative w-32 h-32 bg-slate-900 border-4 border-yellow-400 rounded-full flex items-center justify-center mx-auto shadow-[0_0_30px_rgba(250,204,21,0.8)]">
                        <span class="text-6xl">🏆</span>
                    </div>
                `;
                resultTitle.textContent = "全破通關！";
                resultTitle.className = "text-5xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-b from-yellow-300 to-yellow-500 drop-shadow-lg tracking-widest";
            }

            document.getElementById('final-score').textContent = score.toLocaleString();
            document.getElementById('correct-count').textContent = correctAnswersCount;
            document.getElementById('wrong-count').textContent = wrongAnswersCount;

            showScreen('result');

            // 檢查是否符合英雄榜資格
            if (score > 0 && db) {
                checkLeaderboardEligibility();
            }
        }

        async function checkLeaderboardEligibility() {
            try {
                // 讀取當前難度的前10名 (更換集合名稱以區分新挑戰，改為 mega160 確保排行榜獨立)
                const snapshot = await leaderboardRef(currentDifficulty)
                                        .orderBy('score', 'desc')
                                        .limit(10)
                                        .get();
                
                const scores = [];
                snapshot.forEach(doc => scores.push(doc.data().score));

                // 如果未滿10人，或者分數高於第10名
                if (scores.length < 10 || score > scores[scores.length - 1]) {
                    isFinalScoreSubmittable = true;
                    document.getElementById('record-submission-area').classList.remove('hidden-screen');
                }
            } catch (error) {
                console.error("無法檢查英雄榜資格:", error);
            }
        }

        async function submitScoreToLeaderboard() {
            if (!isFinalScoreSubmittable || !db) return;

            const inputElement = document.getElementById('student-id-input');
            const errorElement = document.getElementById('submission-error');
            const studentId = inputElement.value.trim();

            // 驗證：必須是 7 位數數字，且以 15 開頭
            const isValid = window.LearnerProfile
                ? window.LearnerProfile.isValidStudentId(studentId)
                : /^15[12]\d{4}$/.test(studentId);

            if (!isValid) {
                errorElement.textContent = "學號格式錯誤！請輸入 7 位數字且需以 15 開頭。";
                errorElement.classList.remove('hidden-screen');
                return;
            }

            errorElement.classList.add('hidden-screen');
            const btn = document.getElementById('submit-score-btn');
            btn.disabled = true;
            btn.textContent = "登錄中...";
            inputElement.disabled = true;

            try {
                // 寫入 11502 期別的排行榜集合。
                await leaderboardRef(currentDifficulty).add({
                    studentId: studentId,
                    score: score,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                isFinalScoreSubmittable = false;
                document.getElementById('submission-success').classList.remove('hidden-screen');
                btn.textContent = "已登錄";
            } catch (error) {
                console.error("登錄分數失敗:", error);
                errorElement.textContent = "連線失敗，請稍後再試。";
                errorElement.classList.remove('hidden-screen');
                btn.disabled = false;
                btn.textContent = "登錄";
                inputElement.disabled = false;
            }
        }

        async function loadLeaderboardData(difficulty) {
            // 切換按鈕樣式
            ['easy', 'normal', 'hard'].forEach(d => {
                const tab = document.getElementById(`tab-${d}`);
                if (d === difficulty) {
                    tab.className = 'flex-1 py-2 text-sm font-bold rounded-md bg-purple-600 text-white shadow-md transition-colors';
                } else {
                    tab.className = 'flex-1 py-2 text-sm font-bold rounded-md text-slate-400 hover:text-white transition-colors';
                }
            });

            const tbody = document.getElementById('leaderboard-body');
            const emptyMsg = document.getElementById('leaderboard-empty');
            const loading = document.getElementById('leaderboard-loading');

            tbody.innerHTML = '';
            emptyMsg.classList.add('hidden-screen');
            
            if (!db) {
                emptyMsg.textContent = "資料庫未連線，無法載入英雄榜。";
                emptyMsg.classList.remove('hidden-screen');
                return;
            }

            loading.classList.remove('hidden-screen');

            try {
                // 讀取 11502 期別的排行榜集合。
                const snapshot = await leaderboardRef(difficulty)
                                        .orderBy('score', 'desc')
                                        .limit(10)
                                        .get();
                
                loading.classList.add('hidden-screen');

                if (snapshot.empty) {
                    emptyMsg.textContent = "尚無紀錄，成為第一位上榜者吧！";
                    emptyMsg.classList.remove('hidden-screen');
                    return;
                }

                let rank = 1;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const tr = document.createElement('tr');
                    
                    let rankDisplay = rank;
                    if (rank === 1) rankDisplay = '🥇';
                    else if (rank === 2) rankDisplay = '🥈';
                    else if (rank === 3) rankDisplay = '🥉';

                    // 將學號稍微遮蔽保護隱私 (選用，目前僅顯示)
                    tr.innerHTML = `
                        <td class="font-black text-lg">${rankDisplay}</td>
                        <td class="font-mono tracking-wider">${data.studentId}</td>
                        <td class="font-black text-yellow-400">${data.score.toLocaleString()}</td>
                    `;
                    tbody.appendChild(tr);
                    rank++;
                });

            } catch (error) {
                console.error("載入英雄榜失敗:", error);
                loading.classList.add('hidden-screen');
                emptyMsg.textContent = "載入失敗，請檢查網路連線。";
                emptyMsg.classList.remove('hidden-screen');
            }
        }

        // 初始化
        showStartScreen();

    </script>
</body>
</html>
