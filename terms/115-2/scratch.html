    <style>
        body {
            font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif;
            background-color: #f8fafc;
        }
        /* 簡單的淡入動畫 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }
        .animate-fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
        .animate-shake {
            animation: shake 0.5s ease-in-out;
        }
        /* 禁止選取與長按選單的樣式 */
        .no-copy {
            user-select: none;              /* 禁止選取 */
            -webkit-user-select: none;      /* Chrome/Safari/Opera */
            -moz-user-select: none;         /* Firefox */
            -ms-user-select: none;          /* IE/Edge */
            -webkit-touch-callout: none;    /* iOS Safari 禁止長按跳出選單 */
            pointer-events: auto;           /* 保持點擊事件運作 */
        }
    </style>

    <script type="module">
        import { initializeApp, getApp, getApps } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const { SCHOOL_APP, LearnerProfile } = window;
        const storageKey = SCHOOL_APP.storageKeys.flowchartProgress;
        let scopedStorageKey = '';
        let records = {};
        let firebaseUser = null;
        let db = null;
        let saveQueue = Promise.resolve();
        let ready;
        window.FlowchartProgress = new Promise(resolve => { ready = resolve; });
        const storageKeyFor = user => `${storageKey}.${user?.uid || 'guest'}`;
        const loadLocal = () => LearnerProfile.readTermStorage(scopedStorageKey, {}).units || {};
        const storeLocal = () => LearnerProfile.writeTermStorage(scopedStorageKey, { units: records });
        if (!SCHOOL_APP.isFirebaseConfigured()) {
            scopedStorageKey = storageKeyFor();
            records = loadLocal();
            ready(records);
        }
        else {
            const app = getApps().length ? getApp() : initializeApp(SCHOOL_APP.firebaseConfig);
            db = getFirestore(app);
            onAuthStateChanged(getAuth(app), async user => {
                firebaseUser = user;
                scopedStorageKey = storageKeyFor(user);
                records = loadLocal();
                if (!user) { ready(records); return; }
                try {
                    const snapshot = await getDoc(doc(db, 'users', user.uid));
                    const remote = snapshot.data()?.terms?.[SCHOOL_APP.currentTermId]?.workflow?.flowcharts || {};
                    records = { ...records, ...remote };
                    storeLocal();
                } catch (error) { console.error(error); }
                ready(records);
            });
        }
        window.saveFlowchartProgress = async (unitId, record) => {
            records = { ...records, [unitId]: record };
            storeLocal();
            const recordsToSave = records;
            if (firebaseUser && db) {
                saveQueue = saveQueue.catch(() => {}).then(() => setDoc(doc(db, 'users', firebaseUser.uid), {
                    terms: { [SCHOOL_APP.currentTermId]: { workflow: { flowcharts: recordsToSave }, updatedAt: new Date().toISOString() } }
                }, { merge: true }));
                await saveQueue;
            }
            return records;
        };
    </script>

                return { ...question, options: options.map(item => item.text), answer: options.findIndex(item => item.correct) };
            });
            const openGoalCheck = () => {
                if (!selectedUnit || !referenceReads[selectedUnit.id]) return;
                setGoalQuestionIndex(0);
                setGoalQuestions(shuffledGoalQuestions(selectedUnit));
                setGoalCheckFeedback('先完成三題「本單元學習重點確認」，全對後才會開放流程圖教練。');
                setGoalCheckModalOpen(true);
            };
            const answerGoalCheck = answerIndex => {
                if (!selectedUnit) return;
                const questions = goalQuestions;
                const question = questions[goalQuestionIndex];
                if (!question) return;
                if (answerIndex !== question.answer) {
                    setGoalQuestionIndex(0);
                    setGoalQuestions(shuffledGoalQuestions(selectedUnit));
                    setGoalCheckFeedback(`這一題要回看「${question.focus}」。三題需要連續全對，請從第一題再試一次。`);
                    return;
                }
                const nextQuestion = goalQuestionIndex + 1;
                if (nextQuestion < questions.length) {
                    setGoalQuestionIndex(nextQuestion);
                    setGoalCheckFeedback('答對了，繼續完成下一題。');
                    return;
                }
                const record = { ...(flowchartRecords[selectedUnit.id] || {}), title: selectedUnit.title, goalCheckAt: new Date().toISOString(), source: 'learning-goals-check' };
                window.saveFlowchartProgress(selectedUnit.id, record).then(records => {
                    setFlowchartRecords(records);
                    setGoalCheckModalOpen(false);
                    setFlowchartMessage('✓ 已完成本單元學習重點確認，現在可以開啟流程圖教練。');
                }).catch(error => console.error(error));
            };
            const openFlowchartCoach = () => {
                if (!selectedUnit || !referenceReads[selectedUnit.id] || !goalCheckPassed(selectedUnit)) return;
                setCoachRound(0);
                setCoachChoices([]);
                setCoachFeedback(`教練：我們會走完四個不同的流程決策。每一個選擇都會保留在你的流程圖裡。`);
                setCoachModalOpen(true);
            };
            const answerCoach = option => {
                if (!selectedUnit) return;
                const nextChoices = [...coachChoices, option];
                if (nextChoices.length >= 4) {
                    const rawScore = nextChoices.reduce((total, item) => total + item.score, 0);
                    const hasCriticalIssue = nextChoices.some(item => item.critical);
                    const score = hasCriticalIssue ? Math.min(rawScore, 84) : rawScore;
                    const result = { score, rawScore, hasCriticalIssue, choices: nextChoices.map(item => ({ route: item.route, label: item.label, flowStep: item.flowStep, score: item.score, weight: item.weight, critical: item.critical, concept: item.concept })), completedAt: new Date().toISOString() };
                    setCoachResults(current => ({ ...current, [selectedUnit.id]: result }));
                    setFlowSteps(result.choices.map(item => item.flowStep).join('\n'));
                    setOrderedFlowSteps(result.choices.map(item => item.flowStep));
                    const record = { ...(flowchartRecords[selectedUnit.id] || {}), steps: (selectedUnit.flowchartSteps || result.choices.map(item => item.flowStep)).join('\n'), title: selectedUnit.title, coachResult: result, source: 'hint-code-flowchart' };
                    window.saveFlowchartProgress(selectedUnit.id, record).then(setFlowchartRecords).catch(error => console.error(error));
                    setCoachRound(4);
                    setCoachFeedback(score >= 85 ? `教練：本次得分 ${score} 分，核心任務條件完整，已達通關標準！` : (hasCriticalIssue ? `教練：本次得分 ${score} 分；有一項核心任務條件未成立，因此不能通關。` : `教練：本次得分 ${score} 分，未達 85 分；可以再次闖關刷新分數。`));
                    return;
                }
                setCoachChoices(nextChoices);
                setCoachRound(nextChoices.length);
                setCoachFeedback(`教練：你選擇了「${option.route}」。${option.feedback} ${option.reference || ''}`);
            };

            const exportFlowchartMarkdown = async (providedSteps = null) => {
                if (!selectedUnit) return;
                const steps = providedSteps || flowSteps.split(/\r?\n/).map(step => step.trim()).filter(Boolean);
                if (steps.length < 2) { setFlowchartMessage('請將題目描述改寫成至少兩個清楚的流程步驟，每行一個步驟。'); return false; }
                const coachResult = coachResultFor(selectedUnit);
                const sourceMermaid = selectedUnit.flowchartMermaid || ['flowchart TD', '  start([開始])', ...steps.map((step, index) => `  step${index + 1}[${step.replace(/[\[\]{}()"']/g, '')}]`), ...steps.map((_, index) => index === 0 ? '  start --> step1' : `  step${index} --> step${index + 1}`), `  step${steps.length} --> finish`, '  finish([結束])'].join('\n');
                const coachTrail = coachResult ? ['  subgraph coachTrail["本次教練選擇"]', '    coachStart([開始討論])', ...coachResult.choices.map((choice, index) => `    coach${index + 1}[${choice.route}：${choice.label.replace(/[\[\]{}()"']/g, '')}]`), ...coachResult.choices.map((_, index) => index === 0 ? '    coachStart --> coach1' : `    coach${index} --> coach${index + 1}`), `    coach${coachResult.choices.length} --> coachEnd([完成討論])`, '  end'].join('\n') : '';
                const mermaidCode = [sourceMermaid, coachTrail].filter(Boolean).join('\n');
                setGeneratedMermaidCode(mermaidCode);
                try {
                    const record = { steps: steps.join('\n'), exportedAt: new Date().toISOString(), title: selectedUnit.title, coachResult: coachResultFor(selectedUnit) || null, source: 'hint-code-flowchart' };
                    const records = await window.saveFlowchartProgress(selectedUnit.id, record);
                    setFlowchartRecords(records);
                    setFlowchartMessage('Mermaid code 已顯示，流程圖任務已通關；可直接複製貼入 Mermaid AI。');
                    return true;
                } catch (error) { console.error(error); setFlowchartMessage('Mermaid code 已顯示，但完成紀錄暫時未同步，請稍後再試。'); return false; }
            };

            // --- 測驗邏輯 ---
            
            // 開始測驗
            const moveFlowStep = (index, direction) => {
                setOrderedFlowSteps(current => {
                    const target = index + direction;
                    if (target < 0 || target >= current.length) return current;
                    const next = [...current];
                    [next[index], next[target]] = [next[target], next[index]];
                    return next;
                });
            };

            const generateMermaidCode = async () => {
                const result = coachResultFor(selectedUnit);
                if (!selectedUnit || Number(result?.score) < 85 || generatingMermaid) return;
                setGeneratingMermaid(true);
                setFlowchartMessage('正在產生 Mermaid code…');
                try {
                    await exportFlowchartMarkdown(selectedUnit.flowchartSteps || result.choices.map(item => item.flowStep));
                } finally {
                    setGeneratingMermaid(false);
                }

            const copyMermaidCode = async () => {
                const code = generatedMermaidCode || selectedUnit?.flowchartMermaid || '';
                if (!code) return;
                try {
                    await navigator.clipboard.writeText(code);
                    setFlowchartMessage('Mermaid code 已複製，現在可貼入 Mermaid AI。');

            const startQuiz = () => {
                if (!selectedUnit || !selectedUnit.quizBank) return;
                
                // 動態決定題數：1 張圖考 2 題，2 張圖考 3 題，3 張圖考 4 題...

                    const randomIndex = Math.floor(Math.random() * bank.length);
                    selected.push(bank[randomIndex]);
                    bank.splice(randomIndex, 1);
                }
                
                setCurrentQuizQuestions(selected);
                setCurrentQuestionIndex(0);
                setQuizFeedback(null);
                setIsQuizModalOpen(true);
            };

                } else {
                    setShake(true);
                    setQuizFeedback('wrong');
                    setTimeout(() => setShake(false), 500);
                }
            };

            const retryQuiz = () => {
                startQuiz();
            };

                                                    target="_blank" 
                                                    rel="noopener noreferrer"
                                                    className={`block w-full text-center bg-blue-600 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-sm ${flowchartRecords[selectedUnit.id]?.exportedAt ? 'hover:bg-blue-700 active:transform active:scale-95' : 'pointer-events-none opacity-40'}`}
                                                >
                                                    開啟原始程式專案
                                                </a>
                                            </div>

                                            {/* 2. 解題提示 - 需先通關測驗 */}
                                            <div className="bg-white rounded-xl p-6 border border-green-100 shadow-sm hover:shadow-md transition-shadow">
                                                <div className="flex items-center mb-3">
                                                    <div className="p-2 bg-green-100 rounded-lg mr-3">
                                                         <Icons.Brain className="w-5 h-5 text-green-600" />
                                                    </div>
                                                    <h3 className="font-bold text-slate-800">解題提示挑戰</h3>
                                                </div>
                                                <p className="text-sm text-slate-500 mb-4">
                                                    想查看提示圖嗎？請先連續答對 {Math.min(selectedUnit.quizBank.length, selectedUnit.uploadLinks.length + 1)} 題關於本單元的觀念測驗！
                                                </p>
                                                
                                                {/* 挑戰按鈕/縮圖區 */}
                                                <div 
                                                    className="w-full h-48 bg-slate-100 rounded-lg overflow-hidden cursor-pointer relative group border border-slate-200"
                                                    onClick={startQuiz}
                                                >
                                                    {/* 模糊處理的圖片，代表鎖定，永遠顯示第一張 */}
                                                    <img 
                                                        src={selectedUnit.uploadLinks[0]}
                                                        alt="解題提示(鎖定)" 
                                                        className="w-full h-full object-cover blur-sm opacity-60 no-copy"
                                                        draggable="false"
                                                        onContextMenu={(e) => e.preventDefault()}
                                                    />
                                                    
                                                    {/* 鎖定/挑戰 遮罩 */}
                                                    <div className="absolute inset-0 bg-black/10 group-hover:bg-black/30 transition-colors flex flex-col items-center justify-center text-center p-4">
                                                        <div className="bg-green-600 text-white p-3 rounded-full shadow-lg mb-2 transform group-hover:scale-110 transition-transform duration-300">
                                                            <Icons.Brain className="w-6 h-6" />
                                                        </div>
                                                        <span className="bg-white/90 text-green-800 text-sm font-bold px-3 py-1 rounded shadow-sm">
                                                            點擊開始測驗 ({Math.min(selectedUnit.quizBank.length, selectedUnit.uploadLinks.length + 1)}題)
                                                        </span>
                                                    </div>
                                                    
                                                    {/* 多張圖片標示 */}
                                                    {selectedUnit.uploadLinks.length > 1 && (
                                                        <div className="absolute top-2 right-2 bg-black/60 text-white text-xs px-2 py-1 rounded-md flex items-center backdrop-blur-sm">
                                                            <Icons.Images className="w-3 h-3 mr-1" />
                                                            <span>共 {selectedUnit.uploadLinks.length} 張</span>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>

                                            {/* 提示卡片 */}
                                            <div className="bg-orange-50 rounded-xl p-4 border border-orange-100 relative overflow-hidden">
                                                <div className="absolute top-0 right-0 -mt-2 -mr-2 w-12 h-12 bg-orange-200 rounded-full opacity-50"></div>
                                                <h4 className="text-orange-800 font-bold text-sm mb-2 flex items-center relative z-10">
                                                    <span className="text-lg mr-1">💡</span> 小撇步
                                                </h4>
                                                <p className="text-orange-800/80 text-sm relative z-10">
                                                    遇到困難嗎？您可以先查看「原始程式碼」裡面的積木排列方式，再嘗試自己拼湊看看！
                                                </p>
                                            </div>

                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {referenceModalOpen && selectedUnit && (
                            <div className="fixed inset-0 z-[120] flex items-center justify-center bg-slate-950/70 p-3 backdrop-blur-sm">
                                <section className="flex h-[92vh] w-full max-w-6xl flex-col overflow-hidden rounded-3xl bg-white shadow-2xl">
                                    <header className="flex items-center justify-between border-b border-slate-200 px-5 py-4"><div><p className="text-xs font-black tracking-[.18em] text-emerald-600">REFERENCE DOCUMENT</p><h2 className="mt-1 text-lg font-black text-slate-800">流程圖參考文件</h2></div><button type="button" onClick={() => setReferenceModalOpen(false)} className="rounded-xl bg-slate-100 p-2 text-slate-600 hover:bg-slate-200" aria-label="關閉"><Icons.X className="h-6 w-6" /></button></header>
                                    <iframe src={`project.html?unit=${selectedUnit.id}`} title="流程圖參考文件" className="min-h-0 flex-1 border-0" />
                                </section>
                            </div>
                        )}

                        {goalCheckModalOpen && selectedUnit && (() => {
                            const question = goalQuestions[goalQuestionIndex];
                            if (!question) return null;
                            return <div className="fixed inset-0 z-[120] flex items-center justify-center bg-slate-950/70 p-4 backdrop-blur-sm">
                                <section className="w-full max-w-xl overflow-hidden rounded-3xl bg-white shadow-2xl">
                                    <header className="flex items-center justify-between bg-gradient-to-r from-sky-600 to-indigo-600 px-6 py-5 text-white"><div><p className="text-xs font-black tracking-[.18em] text-sky-100">LEARNING GOALS CHECK</p><h2 className="mt-1 text-xl font-black">本單元學習重點確認</h2></div><button type="button" onClick={() => setGoalCheckModalOpen(false)} className="rounded-xl bg-white/15 p-2 hover:bg-white/25" aria-label="關閉"><Icons.X className="h-6 w-6" /></button></header>
                                    <div className="p-6"><p className="text-xs font-black tracking-[.14em] text-sky-700">第 {goalQuestionIndex + 1} / 3 題 · 三題需連續全對</p><div className="mt-3 rounded-2xl bg-sky-50 p-4 text-base font-black leading-7 text-sky-950">{question.question}</div><div className="mt-4 grid gap-2">{question.options.map((choice, index) => <button key={choice} type="button" onClick={() => answerGoalCheck(index)} className="rounded-xl border border-slate-200 bg-white px-4 py-3 text-left text-sm font-bold text-slate-700 transition hover:border-sky-400 hover:bg-sky-50"><span className="mr-2 text-xs font-black text-sky-600">{String.fromCharCode(65 + index)}.</span>{choice}</button>)}</div><p className={`mt-4 rounded-xl p-3 text-sm font-bold ${goalCheckFeedback.includes('回看') ? 'bg-amber-50 text-amber-800' : 'bg-sky-50 text-sky-800'}`}>{goalCheckFeedback}</p><button type="button" onClick={() => setGoalCheckModalOpen(false)} className="mt-4 w-full rounded-xl px-4 py-3 text-sm font-bold text-slate-600 hover:bg-slate-100">稍後再說</button></div>
                                </section>
                            </div>;
                        })()}

                        {coachModalOpen && selectedUnit && (
                            <div className="fixed inset-0 z-[120] flex items-center justify-center bg-slate-950/70 p-4 backdrop-blur-sm">
                                <section className="w-full max-w-xl overflow-hidden rounded-3xl bg-white shadow-2xl">
                                    <header className="flex items-center justify-between bg-gradient-to-r from-emerald-600 to-teal-600 px-6 py-5 text-white"><div><p className="text-xs font-black tracking-[.18em] text-emerald-100">FLOWCHART COACH</p><h2 className="mt-1 text-xl font-black">流程圖教練</h2></div><button type="button" onClick={() => setCoachModalOpen(false)} className="rounded-xl bg-white/15 p-2 hover:bg-white/25" aria-label="關閉"><Icons.X className="h-6 w-6" /></button></header>
                                    <div className="p-6">
                                        {coachRound < 4 ? <><p className="text-xs font-black tracking-[.14em] text-emerald-700">決策 {coachRound + 1} / 4</p><div className="mt-3 rounded-2xl bg-emerald-50 p-4 text-sm font-bold leading-7 text-emerald-900"><span className="mr-2">🧭</span>{coachBlueprint(selectedUnit)[coachRound].prompt}</div><p className="mt-3 text-xs font-bold text-slate-500">三個方案都能執行，但會改變程式結果與得分；請判斷它在流程圖中屬於哪一種概念。</p><div className="mt-3 rounded-xl border border-indigo-100 bg-indigo-50 px-4 py-3 text-xs font-bold leading-6 text-indigo-800">📘 {coachBlueprint(selectedUnit)[coachRound].reference}</div><div className="mt-4 grid gap-2">{coachBlueprint(selectedUnit)[coachRound].options.map(option => <button key={option.route} type="button" onClick={() => answerCoach(option)} className="rounded-xl border border-slate-200 bg-white px-4 py-3 text-left text-sm font-bold text-slate-700 transition hover:border-emerald-400 hover:bg-emerald-50"><span className="block text-xs font-black text-emerald-600">{option.route}</span><span className="mt-1 block">{option.label}</span></button>)}</div></> : <div className={`rounded-3xl border-2 p-6 text-center ${Number(coachResultFor(selectedUnit)?.score) >= 85 ? 'border-amber-300 bg-gradient-to-br from-amber-50 to-emerald-50' : 'border-slate-200 bg-slate-50'}`}><p className="text-xs font-black tracking-[.2em] text-amber-700">{Number(coachResultFor(selectedUnit)?.score) >= 85 ? 'FLOWCHART PASS CERTIFICATE' : 'FLOWCHART COACH RESULT'}</p><div className="mx-auto mt-4 grid h-24 w-24 place-items-center rounded-full border-4 border-amber-300 bg-white text-3xl font-black text-amber-600 shadow-sm">{coachResultFor(selectedUnit)?.score}</div><h3 className="mt-4 text-2xl font-black text-slate-800">{Number(coachResultFor(selectedUnit)?.score) >= 85 ? '流程圖教練通關證明' : '本次流程圖教練結果'}</h3><p className="mt-2 text-sm font-bold text-slate-600">{Number(coachResultFor(selectedUnit)?.score) >= 85 ? '達到 85 分通關標準，已取得依程式碼產生 Mermaid 的資格。' : '未達 85 分通關標準；再次闖關可依新路線刷新分數。'}</p><p className="mt-3 text-xs font-bold text-slate-500">完成時間：{coachResultFor(selectedUnit)?.completedAt ? new Date(coachResultFor(selectedUnit).completedAt).toLocaleString('zh-TW') : '—'}</p></div>}
                                        <p className={`mt-4 rounded-xl p-3 text-sm font-bold ${coachFeedback.includes('得分') || coachFeedback.includes('標準') || coachFeedback.includes('修正') ? 'bg-emerald-50 text-emerald-800' : 'bg-amber-50 text-amber-800'}`}>{coachFeedback}</p>
                                        <div className="mt-5 flex flex-wrap justify-end gap-3"><button type="button" onClick={() => setCoachModalOpen(false)} className="rounded-xl px-4 py-3 text-sm font-bold text-slate-600 hover:bg-slate-100">稍後再說</button>{coachRound >= 4 && <button type="button" onClick={openFlowchartCoach} className="rounded-xl border border-emerald-300 bg-white px-5 py-3 text-sm font-black text-emerald-700 hover:bg-emerald-50">再次闖關，刷新分數</button>}{coachRound >= 4 && Number(coachResultFor(selectedUnit)?.score) >= 85 && <button type="button" onClick={() => { setGeneratedMermaidCode(''); setCoachModalOpen(false); setMermaidModalOpen(true); }} className="rounded-xl bg-emerald-600 px-5 py-3 text-sm font-black text-white hover:bg-emerald-700">前往顯示 Mermaid code →</button>}</div>
                                    </div>
                                </section>
                            </div>
                        )}

                        {mermaidModalOpen && selectedUnit && (
                            <div className="fixed inset-0 z-[120] flex items-center justify-center bg-slate-950/70 p-4 backdrop-blur-sm">
                                <section className="w-full max-w-lg overflow-hidden rounded-3xl bg-white shadow-2xl">
                                    <header className="flex items-center justify-between bg-gradient-to-r from-indigo-600 to-violet-600 px-6 py-5 text-white"><div><p className="text-xs font-black tracking-[.18em] text-indigo-100">STEP 4 · MERMAID</p><h2 className="mt-1 text-xl font-black">顯示 Mermaid code</h2></div><button type="button" onClick={() => setMermaidModalOpen(false)} className="rounded-xl bg-white/15 p-2 hover:bg-white/25" aria-label="關閉"><Icons.X className="h-6 w-6" /></button></header>
                                    <div className="p-6"><p className="text-sm leading-7 text-slate-600">教練已確認你對本關程式結構的理解。程式碼會直接顯示在下方；可複製後貼到 Mermaid AI，不會下載檔案。</p>{(generatedMermaidCode || flowchartRecords[selectedUnit.id]?.exportedAt) ? <><pre className="mt-4 max-h-64 overflow-auto rounded-2xl bg-slate-950 p-4 text-xs font-bold leading-6 text-emerald-200">{generatedMermaidCode || selectedUnit.flowchartMermaid}</pre><button type="button" onClick={copyMermaidCode} className="mt-3 w-full rounded-xl border border-indigo-200 bg-indigo-50 px-5 py-3 text-sm font-black text-indigo-700 hover:bg-indigo-100">複製 Mermaid code</button><a href="https://mermaid.ai/web/" target="_blank" rel="noopener noreferrer" className="mt-3 block w-full rounded-xl border border-indigo-200 bg-white px-5 py-3 text-center text-sm font-black text-indigo-700 hover:bg-indigo-50">開啟 Mermaid AI，貼上程式碼 ↗</a></> : <button type="button" disabled={generatingMermaid} onClick={generateMermaidCode} className={`mt-5 w-full rounded-xl px-5 py-4 text-sm font-black text-white shadow-lg ${generatingMermaid ? 'cursor-wait bg-indigo-400' : 'bg-indigo-600 hover:bg-indigo-700'}`}>{generatingMermaid ? '正在整理 Mermaid code…' : '顯示 Mermaid code 並完成通關'}</button>}<button type="button" onClick={() => setMermaidModalOpen(false)} className="mt-4 w-full rounded-xl px-4 py-3 text-sm font-bold text-slate-600 hover:bg-slate-100">返回課程</button></div>
                                </section>
                            </div>
                        )}

                        {/* 測驗 Modal */}
                        {isQuizModalOpen && currentQuizQuestions.length > 0 && (
                            <div className="fixed inset-0 z-[110] bg-black/80 flex items-center justify-center p-4 animate-fade-in backdrop-blur-sm">
                                <div className={`bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 relative ${shake ? 'animate-shake' : ''}`}>
                                    {/* 關閉按鈕 */}
                                    <button 
                                        onClick={() => setIsQuizModalOpen(false)}
                                        className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-colors"
                                    >
                                        <Icons.X className="w-6 h-6" />
                                    </button>

                                    {quizFeedback === 'wrong' ? (
                                        // 答錯畫面
                                        <div className="text-center py-8">
                                            <div className="w-20 h-20 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                                                <Icons.X className="w-10 h-10" />
                                            </div>
                                            <h3 className="text-2xl font-bold text-slate-800 mb-2">哎呀，答錯了！</h3>
                                            <p className="text-slate-600 mb-6">必須連續答對 {currentQuizQuestions.length} 題才能解鎖提示喔。</p>
                                            <button 
                                                onClick={retryQuiz}
                                                className="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-8 rounded-full transition-colors shadow-lg active:transform active:scale-95"
                                            >
                                                重新挑戰
                                            </button>
                                        </div>
                                    ) : (
                                        // 答題畫面
                                        <div className="animate-fade-in">
                                            <div className="flex items-center justify-between mb-6">
                                                <span className="text-xs font-bold text-blue-600 bg-blue-100 px-2 py-1 rounded-full uppercase tracking-wide">
                                                    解鎖挑戰
                                                </span>
                                                <span className="text-sm font-medium text-slate-400">
                                                    問題 {currentQuestionIndex + 1} / {currentQuizQuestions.length}
                                                </span>
                                            </div>
                                            
                                            <h3 className="text-xl font-bold text-slate-800 mb-6 leading-relaxed">
                                                {currentQuizQuestions[currentQuestionIndex].q}
                                            </h3>

                                            <div className="space-y-3">
                                                {currentQuizQuestions[currentQuestionIndex].options.map((option, idx) => (
                                                    <button
                                                        key={idx}
                                                        onClick={() => handleAnswer(idx)}
                                                        disabled={quizFeedback === 'correct'}
                                                        className={`w-full text-left p-4 rounded-xl border-2 transition-all font-medium flex items-center
                                                            ${quizFeedback === 'correct' && idx === currentQuizQuestions[currentQuestionIndex].ans 
                                                                ? 'border-green-500 bg-green-50 text-green-700' 
                                                                : 'border-slate-100 hover:border-blue-400 hover:bg-blue-50 text-slate-700'
                                                            }
                                                        `}
                                                    >
                                                        <div className={`w-6 h-6 rounded-full border-2 mr-3 flex items-center justify-center flex-shrink-0
                                                            ${quizFeedback === 'correct' && idx === currentQuizQuestions[currentQuestionIndex].ans 
                                                                ? 'border-green-500 bg-green-500 text-white' 
                                                                : 'border-slate-300'
                                                            }
                                                        `}>
                                                            {quizFeedback === 'correct' && idx === currentQuizQuestions[currentQuestionIndex].ans && <Icons.CheckCircle className="w-4 h-4" />}
                                                        </div>
                                                        {option}
                                                    </button>
                                                ))}
                                            </div>
                                            
                                            {quizFeedback === 'correct' && (
                                                <div className="mt-4 text-center text-green-600 font-bold animate-fade-in">
                                                    答對了！{currentQuestionIndex < currentQuizQuestions.length - 1 ? "下一題..." : "正在解鎖..."}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                        
                        {/* 圖片燈箱 Modal (解鎖後顯示，支援多圖切換) */}
                        {isImageModalOpen && selectedUnit && (
                            <div 
                                className="fixed inset-0 z-[120] bg-black/90 flex items-center justify-center p-4 animate-fade-in backdrop-blur-sm"
                                onClick={() => setIsImageModalOpen(false)}
                            >
                                <div className="relative max-w-6xl w-full h-full flex flex-col items-center justify-center pointer-events-none">
                                    {/* 關閉按鈕 */}
                                    <button 
                                        className="absolute top-4 right-4 md:top-0 md:-right-12 text-white/70 hover:text-white transition-colors pointer-events-auto bg-black/50 md:bg-transparent p-2 rounded-full z-20"
                                        onClick={() => setIsImageModalOpen(false)}
                                    >
                                        <Icons.X className="w-8 h-8 md:w-10 md:h-10" />
                                    </button>

                                    {/* 大圖容器 */}
                                    <div className="relative w-full h-full flex items-center justify-center">
                                        
                                        {/* 上一張按鈕 */}
                                        {selectedUnit.uploadLinks.length > 1 && (
                                            <button 
                                                className={`absolute left-0 md:-left-16 p-2 text-white/70 hover:text-white transition-colors pointer-events-auto bg-black/30 md:bg-transparent rounded-full z-20 ${currentHintIndex === 0 ? 'opacity-30 cursor-not-allowed' : ''}`}
                                                onClick={prevImage}
                                                disabled={currentHintIndex === 0}
                                            >
                                                <Icons.ChevronLeft className="w-10 h-10 md:w-16 md:h-16" />
                                            </button>
                                        )}

                                        {/* 圖片本體 */}
                                        <img 
                                        src={selectedUnit.uploadLinks[currentHintIndex]}
                                            alt={`解題提示 ${currentHintIndex + 1}`} 
                                            className="max-w-full max-h-[80vh] md:max-h-[85vh] object-contain rounded-lg shadow-2xl pointer-events-auto bg-white no-copy select-none"
                                            onClick={(e) => e.stopPropagation()} 
                                            draggable="false"
                                            onContextMenu={(e) => e.preventDefault()}
                                        />

                                        {/* 下一張按鈕 */}
                                        {selectedUnit.uploadLinks.length > 1 && (
                                            <button 
                                                className={`absolute right-0 md:-right-16 p-2 text-white/70 hover:text-white transition-colors pointer-events-auto bg-black/30 md:bg-transparent rounded-full z-20 ${currentHintIndex === selectedUnit.uploadLinks.length - 1 ? 'opacity-30 cursor-not-allowed' : ''}`}
                                                onClick={nextImage}
                                                disabled={currentHintIndex === selectedUnit.uploadLinks.length - 1}
                                            >
                                                <Icons.ChevronRight className="w-10 h-10 md:w-16 md:h-16" />
                                            </button>
                                        )}
                                    </div>
                                    
                                    {/* 頁碼指示器 (僅在多圖時顯示) */}
                                    {selectedUnit.uploadLinks.length > 1 && (
                                        <div className="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-black/60 text-white px-4 py-2 rounded-full text-sm font-bold tracking-widest backdrop-blur-md pointer-events-auto">
                                            {currentHintIndex + 1} / {selectedUnit.uploadLinks.length}
                                        </div>
                                    )}
                                    
                                    <p className="text-white/80 mt-4 text-sm font-medium md:block hidden">
                                        恭喜通關！{selectedUnit.uploadLinks.length > 1 ? "點擊左右箭頭切換圖片，" : ""}點擊背景或關閉按鈕以返回
                                    </p>
                                </div>
                            </div>
                        )}
                    </main>
                    
                    {/* Footer */}
                    <footer className="bg-slate-800 text-slate-400 py-8 mt-auto border-t border-slate-700">
                        <div className="max-w-6xl mx-auto px-4 text-center">
                            <p className="mb-2 font-medium text-slate-300">Scratch 創意程式設計教學平台</p>
                            <p className="text-sm">©Copyright QFM Computer Science</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ScratchPortal />);
    </script>
</body>
</html>
