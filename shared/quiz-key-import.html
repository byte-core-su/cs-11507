<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教師工具｜題庫安全金鑰匯入</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="../firebase-config.js"></script>
</head>
<body class="min-h-screen bg-slate-100 p-6 font-sans text-slate-800">
  <main class="mx-auto max-w-2xl rounded-3xl bg-white p-8 shadow-xl">
    <p class="text-xs font-black tracking-[.2em] text-indigo-500">TEACHER ONLY</p>
    <h1 class="mt-2 text-2xl font-black">題庫安全金鑰匯入</h1>
    <p class="mt-3 leading-7 text-slate-600">選取本機的 <code class="rounded bg-slate-100 px-1.5 py-0.5">quiz-answer-keys.json</code> 後，系統會寫入受保護的 Firestore 答案金鑰。此檔案不可上傳 GitHub、雲端硬碟或學生可存取的位置。</p>
    <div id="identity" class="mt-5 rounded-2xl bg-amber-50 p-4 text-sm font-bold text-amber-800">正在確認教師身分…</div>
    <label class="mt-6 block text-sm font-black">答案金鑰檔案
      <input id="key-file" class="mt-2 block w-full rounded-xl border border-slate-300 p-3 text-sm" type="file" accept="application/json,.json" disabled>
    </label>
    <button id="import" class="mt-5 rounded-xl bg-indigo-600 px-5 py-3 text-sm font-black text-white disabled:cursor-not-allowed disabled:bg-slate-300" disabled>匯入安全金鑰</button>
    <p id="message" class="mt-4 min-h-6 text-sm text-slate-600"></p>
  </main>
  <script>
    (() => {
      const teacherEmail = 'jimwang@mail.qfm.kh.edu.tw';
      const $ = id => document.getElementById(id);
      const config = window.SCHOOL_APP?.firebaseConfig || window.LEARNING_FIREBASE_CONFIG;
      const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(config);
      const auth = firebase.auth(app);
      const db = firebase.firestore(app);
      let teacherReady = false;

      auth.onAuthStateChanged(user => {
        teacherReady = Boolean(user && String(user.email || '').toLowerCase() === teacherEmail);
        $('identity').textContent = teacherReady
          ? `已確認教師帳號：${user.email}`
          : '請先由教師端登入 jimwang@mail.qfm.kh.edu.tw，再重新開啟本頁。';
        $('identity').className = `mt-5 rounded-2xl p-4 text-sm font-bold ${teacherReady ? 'bg-emerald-50 text-emerald-800' : 'bg-amber-50 text-amber-800'}`;
        $('key-file').disabled = !teacherReady;
        $('import').disabled = !teacherReady;
      });

      $('import').addEventListener('click', async () => {
        const file = $('key-file').files?.[0];
        if (!teacherReady || !file) { $('message').textContent = '請先選取答案金鑰檔案。'; return; }
        let parsed;
        try { parsed = JSON.parse(await file.text()); } catch (_) { $('message').textContent = '無法讀取 JSON 檔案。'; return; }
        const keys = Array.isArray(parsed?.keys) ? parsed.keys : [];
        if (!keys.length || keys.some(item => !/^q_[A-Za-z0-9_-]+$/.test(item?.id || '')
          || (!Number.isInteger(item?.answerIndex) && typeof item?.answerValue !== 'string'))) {
          $('message').textContent = '這不是有效的答案金鑰檔案。'; return;
        }
        $('import').disabled = true;
        try {
          const batches = [];
          for (let index = 0; index < keys.length; index += 450) batches.push(keys.slice(index, index + 450));
          for (let index = 0; index < batches.length; index += 1) {
            const batch = db.batch();
            batches[index].forEach(item => {
              const answer = Number.isInteger(item.answerIndex)
                ? { answerIndex: item.answerIndex }
                : { answerValue: item.answerValue };
              batch.set(db.collection('quizAnswerKeys').doc(item.id), {
                ...answer,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
              }, { merge: true });
            });
            await batch.commit();
            $('message').textContent = `正在匯入：${Math.min((index + 1) * 450, keys.length)} / ${keys.length}`;
          }
          $('message').textContent = `已完成匯入 ${keys.length} 個安全金鑰。請關閉本頁並妥善保存或刪除本機金鑰檔。`;
        } catch (error) {
          console.error(error);
          $('message').textContent = '匯入失敗。請先在 Firebase Console 部署本專案的新 Firestore Rules，並確認教師登入身分。';
        } finally { $('import').disabled = !teacherReady; }
      });
    })();
  </script>
</body>
</html>
