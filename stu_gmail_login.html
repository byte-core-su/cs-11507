<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>課前準備｜校務 Gmail 與 Classroom 登入</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#1e293b;background:#f8fafc}
    *{box-sizing:border-box} body{min-height:100vh;margin:0;padding:28px 16px;background:radial-gradient(circle at top left,#dbeafe,transparent 36%),radial-gradient(circle at 88% 18%,#ede9fe,transparent 32%),#f8fafc}
    main{width:min(100%,620px);margin:0 auto}.topbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 18px;color:#4f46e5;font-size:13px;font-weight:900}.topbar a{color:#4f46e5;text-decoration:none}.card{overflow:hidden;border:1px solid #dbeafe;border-radius:28px;background:#fff;box-shadow:0 20px 42px #312e811c}.hero{padding:28px 28px 24px;background:linear-gradient(135deg,#4338ca,#7c3aed);color:#fff}.eyebrow{margin:0;color:#ddd6fe;font-size:12px;font-weight:900;letter-spacing:.16em}.hero h1{margin:9px 0 6px;font-size:28px}.hero p{margin:0;color:#e0e7ff;line-height:1.6}.content{padding:28px}.step{display:inline-block;border-radius:999px;background:#eef2ff;padding:6px 10px;color:#4f46e5;font-size:12px;font-weight:900}.content h2{margin:12px 0 6px;font-size:20px}.muted{margin:0;color:#64748b;line-height:1.65}.field{display:block;margin-top:23px;color:#334155;font-size:14px;font-weight:800}.field input{display:block;width:100%;margin-top:8px;border:1px solid #cbd5e1;border-radius:14px;padding:14px 15px;font:inherit;font-size:18px;letter-spacing:.05em}.field input:focus{outline:3px solid #c7d2fe;border-color:#4f46e5}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.primary,.secondary{border:0;border-radius:14px;padding:13px 17px;font:inherit;font-weight:900;cursor:pointer;text-decoration:none}.primary{flex:1;min-width:220px;background:#4f46e5;color:#fff}.primary:hover{background:#4338ca}.secondary{background:#eef2ff;color:#4338ca}.error{min-height:22px;margin:8px 0 0;color:#be123c;font-size:13px;font-weight:700}.account-info{display:none;margin-top:22px;border:1px solid #bfdbfe;border-radius:18px;background:#eff6ff;padding:16px}.account-info.visible{display:block}.account-info h3{margin:0 0 10px;color:#1e3a8a;font-size:16px}.copy-item{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;margin-top:9px;border:1px solid #dbeafe;border-radius:12px;background:#fff;padding:12px;color:#1e3a8a;text-align:left;font:inherit;cursor:pointer}.copy-item:hover{border-color:#818cf8;background:#f8faff}.copy-item span{display:block;font-size:12px;font-weight:800;color:#64748b}.copy-item b{display:block;margin-top:2px;word-break:break-all}.copy-hint{min-height:20px;margin:10px 0 0;color:#047857;font-size:13px;font-weight:800}.notice{margin:22px 0 0;border-radius:16px;background:#f8fafc;padding:14px 16px;color:#64748b;font-size:13px;line-height:1.65}.notice b{color:#334155}@media(max-width:520px){body{padding:16px 12px}.hero,.content{padding:23px 20px}.hero h1{font-size:24px}.primary{min-width:100%}}
  </style>
</head>
<body>
  <main>
    <div class="topbar"><span>前峰國中 · 校務帳號準備</span></div>
    <section class="card" aria-labelledby="page-title">
      <header class="hero"><p class="eyebrow">BEFORE CLASS · 01</p><h1 id="page-title">校務 Gmail 與 Classroom 登入</h1><p>先取得自己的校務帳號，再登入 Google Classroom。</p></header>
      <div class="content">
        <span class="step">步驟 1／2</span><h2>輸入你的七碼學號</h2><p class="muted">帳號資訊只顯示在目前頁面；點擊帳號或密碼即可複製。</p>
        <label class="field" for="student-id">學號<input id="student-id" inputmode="numeric" autocomplete="off" maxlength="7" placeholder="例如：1512026"></label>
        <p id="error" class="error" role="alert"></p>
        <div class="actions"><button id="open-classroom" class="primary" type="button">取得帳號並開啟 Classroom</button><a class="secondary" href="stu_gmail_practise.html">先做輸入練習</a></div>
        <section id="account-info" class="account-info" aria-live="polite"></section>
        <p class="notice"><b>步驟 2／2：</b>複製帳號與密碼後，在新分頁登入 Classroom。若瀏覽器阻擋新分頁，請允許彈出視窗後再試一次。</p>
      </div>
    </section>
  </main>
  <script>
    const input = document.getElementById('student-id');
    const error = document.getElementById('error');
    const accountInfo = document.getElementById('account-info');
    const classroomUrl = 'https://accounts.google.com/v3/signin/identifier?continue=https%3A%2F%2Fclassroom.google.com&hd=mail.qfm.kh.edu.tw&flowName=GlifWebSignIn&flowEntry=ServiceLogin';
    const validId = value => /^15[12]\d{4}$/.test(value);
    const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[char]));
    function copy(text) { navigator.clipboard?.writeText(text).then(() => { document.getElementById('copy-hint').textContent = '已複製到剪貼簿。'; }).catch(() => { document.getElementById('copy-hint').textContent = '無法自動複製，請長按文字後手動複製。'; }); }
    function showAccount() {
      const id = input.value.trim();
      if (!validId(id)) { error.textContent = '請輸入目前學生使用的七碼學號，例如 1512026。'; accountInfo.classList.remove('visible'); return; }
      error.textContent = '';
      const account = `qfm${id}@mail.qfm.kh.edu.tw`, password = `Hereisqfm${id}`;
      accountInfo.innerHTML = `<h3>你的校務帳號資訊</h3><button class="copy-item" type="button" data-copy="${escapeHtml(account)}"><span>Gmail 帳號<b>${escapeHtml(account)}</b></span><strong>點擊複製</strong></button><button class="copy-item" type="button" data-copy="${escapeHtml(password)}"><span>初始密碼<b>${escapeHtml(password)}</b></span><strong>點擊複製</strong></button><p id="copy-hint" class="copy-hint">請依序複製帳號與密碼。</p>`;
      accountInfo.classList.add('visible');
      accountInfo.querySelectorAll('[data-copy]').forEach(button => button.addEventListener('click', () => copy(button.dataset.copy)));
      const opened = window.open(classroomUrl, '_blank');
      if (opened) opened.opener = null;
      if (!opened) error.textContent = '瀏覽器阻擋了 Classroom 分頁，請允許彈出視窗後再試一次。';
    }
    input.addEventListener('input', () => { input.value = input.value.replace(/\D/g, ''); if (error.textContent) error.textContent = ''; });
    input.addEventListener('keydown', event => { if (event.key === 'Enter') showAccount(); });
    document.getElementById('open-classroom').addEventListener('click', showAccount);
  </script>
</body>
</html>
